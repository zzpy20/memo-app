<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f4;--surface:#fff;--border:#e7e5e4;
  --text:#1c1917;--muted:#78716c;--accent:#6366f1;--accent-hover:#4f46e5;
  --danger:#ef4444;--success:#22c55e;--pin:#f59e0b;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Auth */
#auth-overlay{position:fixed;inset:0;background:#1c1917;display:flex;align-items:center;justify-content:center;z-index:2000}
#auth-overlay.hidden{display:none}
.auth-box{background:#fff;border-radius:16px;padding:40px;width:360px;text-align:center}
.auth-box h1{font-size:1.4rem;font-weight:600;margin-bottom:20px}
.auth-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;font-family:inherit;margin-bottom:12px}
.auth-box button{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;font-family:inherit;cursor:pointer;font-weight:500}
#auth-error{color:var(--danger);font-size:.85rem;margin-top:8px;min-height:18px}

/* Page header */
.page-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.back-link{color:var(--muted);text-decoration:none;font-size:.85rem;padding:4px 8px;border-radius:6px;flex-shrink:0;white-space:nowrap}
.back-link:hover{background:var(--bg);color:var(--text)}
.memo-id-badge{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--accent);font-weight:500;background:#ede9fe;padding:3px 10px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.header-spacer{flex:1}
.btn-icon{background:none;border:none;cursor:pointer;padding:5px 7px;border-radius:7px;font-size:.95rem;opacity:.45;line-height:1;transition:opacity .1s;flex-shrink:0}
.btn-icon:hover{opacity:1;background:var(--bg)}
.btn-icon.active{opacity:1}

/* Title section */
.title-section{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 14px}
#title-input{width:100%;border:none;outline:none;font-size:1.5rem;font-weight:600;font-family:inherit;color:var(--text);background:transparent;margin-bottom:6px;display:block}
#title-input::placeholder{color:#ccc;font-weight:400}
#desc-input{width:100%;border:none;outline:none;font-size:.9rem;font-family:inherit;color:var(--muted);background:transparent;resize:none;min-height:20px;line-height:1.5;display:block}
#desc-input::placeholder{color:#ccc}

/* Actions bar */
.actions-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.folder-nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.folder-pill{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;font-size:.8rem;font-family:inherit;cursor:pointer;color:var(--muted);white-space:nowrap}
.folder-pill:hover{border-color:var(--accent);color:var(--accent)}
.folder-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#sort-select{padding:5px 10px;border:1px solid var(--border);border-radius:7px;font-size:.8rem;font-family:inherit;background:var(--surface);color:var(--text);flex-shrink:0}
#new-folder-btn{padding:5px 12px;border:1px solid var(--border);border-radius:7px;font-size:.8rem;font-family:inherit;cursor:pointer;background:transparent;color:var(--muted);flex-shrink:0;white-space:nowrap}
#new-folder-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Drop zone */
.drop-zone{margin:16px 20px;border:2px dashed var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:#f5f3ff}
.drop-zone-icon{font-size:1.6rem;margin-bottom:6px;opacity:.5}
.drop-zone-text{font-size:.85rem;color:var(--muted)}
.drop-zone-text b{color:var(--accent);font-weight:500}

/* File list */
.file-list-wrap{margin:0 20px 16px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.file-list-empty{padding:24px;text-align:center;color:var(--muted);font-size:.85rem}
.file-row{display:flex;align-items:center;padding:9px 14px;gap:10px;border-bottom:1px solid var(--border);transition:background .1s}
.file-row:last-child{border-bottom:none}
.file-row:hover{background:#fafaf9}
.file-row-icon{font-size:1.1rem;flex-shrink:0;width:22px;text-align:center}
.file-row-thumb{width:32px;height:32px;border-radius:5px;object-fit:cover;flex-shrink:0;cursor:pointer}
.file-row-name{flex:1;font-size:.83rem;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row-folder{font-size:.73rem;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:10px;flex-shrink:0;white-space:nowrap}
.file-row-size{font-size:.73rem;color:var(--muted);flex-shrink:0;white-space:nowrap;min-width:52px;text-align:right}
.file-row-actions{display:flex;gap:4px;flex-shrink:0}
.file-row-actions button{padding:3px 8px;border:1px solid var(--border);border-radius:6px;font-size:.72rem;cursor:pointer;background:transparent;font-family:inherit;color:var(--muted);white-space:nowrap}
.file-row-actions button:hover{border-color:var(--accent);color:var(--accent)}
.file-row-actions .del-btn:hover{border-color:var(--danger);color:var(--danger)}

/* Move dropdown */
.move-wrap{position:relative}
.move-menu{position:absolute;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:200;min-width:130px;overflow:hidden}
.move-menu button{display:block;width:100%;text-align:left;padding:8px 14px;border:none;background:transparent;font-size:.82rem;font-family:inherit;cursor:pointer;color:var(--text)}
.move-menu button:hover{background:var(--bg);color:var(--accent)}
.move-menu .move-divider{height:1px;background:var(--border);margin:2px 0}

/* Image gallery */
.gallery-section{margin:0 20px 16px}
.gallery-header{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.image-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gallery-thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--bg)}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .15s}
.gallery-thumb:hover img{transform:scale(1.06)}

/* Sections */
.section{background:var(--surface);border-top:1px solid var(--border)}
.section summary{padding:14px 20px;cursor:pointer;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;list-style:none;user-select:none}
.section summary::-webkit-details-marker{display:none}
.section summary:hover{color:var(--text)}
.section summary .s-right{font-size:.75rem;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.section-body{padding:0 20px 20px}

/* Notes */
.editor-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.editor-toolbar button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;cursor:pointer;background:transparent;font-family:inherit;color:var(--text)}
.editor-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
#note-editor{min-height:160px;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.9rem;line-height:1.6;outline:none}
#note-editor:focus{border-color:var(--accent)}
#note-editor ul,#note-editor ol{padding-left:20px}
.note-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
#note-status{font-size:.78rem;color:var(--muted)}
#save-note-btn{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:.85rem;cursor:pointer;font-family:inherit;font-weight:500}
#save-note-btn:hover{background:var(--accent-hover)}

/* Info fields */
.field-group{margin-bottom:14px}
.field-label{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.field-input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;font-family:inherit;color:var(--text)}
.field-input:focus{outline:none;border-color:var(--accent)}
textarea.field-input{resize:vertical;min-height:72px}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:text;min-height:38px;align-items:center}
.tag-input-wrap:focus-within{border-color:var(--accent)}
.tag-chip{display:inline-flex;align-items:center;gap:4px;background:#ede9fe;color:var(--accent);border-radius:12px;padding:2px 8px;font-size:.78rem}
.tag-chip button{background:none;border:none;cursor:pointer;color:inherit;padding:0;font-size:.85rem;line-height:1}
#tag-text-input{border:none;outline:none;font-size:.85rem;font-family:inherit;min-width:80px;flex:1}
.links-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.link-row{display:flex;gap:8px;align-items:center}
.link-row input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:.83rem;font-family:inherit}
.link-row input:focus{outline:none;border-color:var(--accent)}
.link-row button{padding:5px 9px;border:1px solid var(--border);border-radius:7px;font-size:.8rem;cursor:pointer;background:transparent;color:var(--muted)}
.link-row button:hover{border-color:var(--danger);color:var(--danger)}
#add-link-btn{padding:6px 12px;border:1px dashed var(--border);border-radius:7px;font-size:.82rem;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit}
#add-link-btn:hover{border-color:var(--accent);color:var(--accent)}
#save-info-btn{margin-top:14px;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;font-family:inherit;font-weight:500}
#save-info-btn:hover{background:var(--accent-hover)}
#cover-select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit}
#cover-select:focus{outline:none;border-color:var(--accent)}

/* Trash */
.trash-grid{display:flex;flex-direction:column;gap:8px}
.trash-item{background:var(--bg);border-radius:8px;padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:.83rem}
.trash-item-name{flex:1;color:var(--muted);word-break:break-all}
.trash-item-date{font-size:.72rem;color:var(--muted);white-space:nowrap;flex-shrink:0}
.trash-actions{display:flex;gap:6px;flex-shrink:0}
.trash-actions button{padding:4px 10px;border-radius:6px;border:1px solid var(--border);font-size:.75rem;cursor:pointer;background:transparent;font-family:inherit}
.restore-btn:hover{border-color:var(--success);color:var(--success)}
.perm-del-btn:hover{border-color:var(--danger);color:var(--danger)}

/* Lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1500;display:flex;align-items:center;justify-content:center}
#lightbox.hidden{display:none}
#lb-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;opacity:.7;z-index:10}
#lb-close:hover{opacity:1}
#lb-prev,#lb-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;font-size:2rem;cursor:pointer;padding:12px 16px;border-radius:8px;z-index:10;line-height:1}
#lb-prev{left:16px} #lb-next{right:16px}
#lb-prev:hover,#lb-next:hover{background:rgba(255,255,255,.22)}
#lb-content{max-width:90vw;max-height:85vh;display:flex;align-items:center;justify-content:center}
#lb-content img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:4px}
#lb-content iframe{width:80vw;height:85vh;border:none;border-radius:4px;background:#fff}
#lb-caption{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.75);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80vw}
#lb-counter{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.55);font-size:.78rem}

/* File info modal */
#info-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1600;display:flex;align-items:center;justify-content:center}
#info-modal.hidden{display:none}
.modal-box{background:#fff;border-radius:14px;padding:24px;width:380px;max-width:95vw}
.modal-box h3{font-size:1rem;font-weight:600;margin-bottom:16px}
.modal-box label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:4px;margin-top:12px}
.modal-box input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-size:.9rem;font-family:inherit}
.modal-box input:focus{outline:none;border-color:var(--accent)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal-footer button{padding:7px 16px;border-radius:7px;font-size:.85rem;cursor:pointer;font-family:inherit;font-weight:500}
.btn-cancel{border:1px solid var(--border);background:transparent;color:var(--muted)}
.btn-save{background:var(--accent);color:#fff;border:none}
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="auth-box">
    <h1>Memo</h1>
    <input type="password" id="auth-input" placeholder="Passphrase" autocomplete="current-password">
    <button onclick="doAuth()">Unlock</button>
    <div id="auth-error"></div>
  </div>
</div>

<div class="page-header">
  <a href="../" class="back-link">← Back</a>
  <span id="memo-id-badge" class="memo-id-badge">…</span>
  <div class="header-spacer"></div>
  <button class="btn-icon" id="pin-btn" title="Pin" onclick="togglePin()">📌</button>
  <button class="btn-icon" title="Print label" onclick="printLabel()">🏷</button>
</div>

<div class="title-section">
  <input type="text" id="title-input" placeholder="Untitled memo" autocomplete="off">
  <textarea id="desc-input" placeholder="Add a description…" rows="1" oninput="autoGrow(this)"></textarea>
</div>

<div class="actions-bar">
  <div class="folder-nav" id="folder-nav">
    <button class="folder-pill active" data-folder="" onclick="setFolder(this,'')">All Files</button>
  </div>
  <select id="sort-select" onchange="renderFileList()">
    <option value="name">Sort: Name</option>
    <option value="date">Sort: Date</option>
    <option value="size">Sort: Size</option>
  </select>
  <button id="new-folder-btn" onclick="addFolder()">+ Folder</button>
</div>

<div class="drop-zone" id="drop-zone">
  <div class="drop-zone-icon">↑</div>
  <div class="drop-zone-text">Drop files here · or <b>click to browse</b></div>
  <input type="file" id="file-input" multiple hidden>
</div>

<div class="file-list-wrap" id="file-list-wrap">
  <div class="file-list-empty" id="file-list-empty" style="display:none">No files here yet.</div>
  <div id="file-list"></div>
</div>

<div class="gallery-section" id="gallery-section" style="display:none">
  <div class="gallery-header" id="gallery-header">Images</div>
  <div class="image-gallery" id="image-gallery"></div>
</div>

<details class="section" id="notes-section" open>
  <summary>Notes <span class="s-right" id="note-status-inline"></span></summary>
  <div class="section-body">
    <div class="editor-toolbar">
      <button onclick="exec('bold')"><b>B</b></button>
      <button onclick="exec('italic')"><i>I</i></button>
      <button onclick="exec('underline')"><u>U</u></button>
      <button onclick="exec('insertUnorderedList')">• List</button>
      <button onclick="exec('insertOrderedList')">1. List</button>
      <button onclick="clearNote()">Clear</button>
    </div>
    <div id="note-editor" contenteditable="true" spellcheck="true"></div>
    <div class="note-footer">
      <span id="note-status">No note yet</span>
      <button id="save-note-btn" onclick="saveNote()">Save note</button>
    </div>
  </div>
</details>

<details class="section" id="info-section">
  <summary>Memo Info <span class="s-right" id="uid-hint"></span></summary>
  <div class="section-body">
    <div class="field-group">
      <label class="field-label">Unique Identifier (UID)</label>
      <input type="text" class="field-input" id="uid-input" placeholder="e.g. STOR-001">
    </div>
    <div class="field-group">
      <label class="field-label">Tags</label>
      <div class="tag-input-wrap" id="tag-wrap" onclick="document.getElementById('tag-text-input').focus()">
        <input type="text" id="tag-text-input" placeholder="Add tag, press Enter…">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Cover Image</label>
      <select id="cover-select" class="field-input"><option value="">— None —</option></select>
    </div>
    <div class="field-group">
      <label class="field-label">Links</label>
      <div class="links-list" id="links-list"></div>
      <button id="add-link-btn" onclick="addLink()">+ Add link</button>
    </div>
    <button id="save-info-btn" onclick="saveInfo()">Save</button>
  </div>
</details>

<details class="section" id="trash-section">
  <summary>Trash <span class="s-right" id="trash-count"></span></summary>
  <div class="section-body">
    <div class="trash-grid" id="trash-list"></div>
  </div>
</details>

<!-- Lightbox -->
<div id="lightbox" class="hidden">
  <button id="lb-close" onclick="closeLightbox()">✕</button>
  <button id="lb-prev" onclick="lbNav(-1)">‹</button>
  <div id="lb-content"></div>
  <button id="lb-next" onclick="lbNav(1)">›</button>
  <div id="lb-caption"></div>
  <div id="lb-counter"></div>
</div>

<!-- File info modal -->
<div id="info-modal" class="hidden">
  <div class="modal-box">
    <h3>File Info</h3>
    <label>Caption</label>
    <input type="text" id="modal-caption" placeholder="Describe this file…">
    <label>Tags (comma separated)</label>
    <input type="text" id="modal-tags" placeholder="tag1, tag2">
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveFileInfo()">Save</button>
    </div>
  </div>
</div>

<!-- Move menu (floating) -->
<div id="move-menu" style="display:none;position:fixed;z-index:300;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:130px;overflow:hidden"></div>

<script>
const WORKER = 'https://memo-worker.ausz.workers.dev';
let token = localStorage.getItem('memo_token') || '';
const params = new URLSearchParams(location.search);
const memoId = params.get('id');

let memo = null, meta = { files: {}, folders: [], trash: [] }, allFiles = [];
let currentFolder = '', lbFiles = [], lbIdx = 0, modalFile = null;
let currentTags = [];

const IMG_EXTS = new Set(['jpg','jpeg','png','gif','webp','heic','avif','bmp','svg','tiff']);
const isImg = n => IMG_EXTS.has(ext(n));
const isPdf = n => ext(n) === 'pdf';
const isPreviewable = n => isImg(n) || isPdf(n);
const ext = n => (n.split('.').pop() || '').toLowerCase();
const basename = n => n.split('/').pop();

function api(path, opts = {}) {
  const sep = path.includes('?') ? '&' : '?';
  return fetch(WORKER + path + sep + 't=' + encodeURIComponent(token), opts).then(r => {
    if (r.status === 401) { logout(); throw new Error('unauthorized'); }
    return r;
  });
}
function logout() { localStorage.removeItem('memo_token'); token = ''; document.getElementById('auth-overlay').classList.remove('hidden'); }

async function doAuth() {
  token = document.getElementById('auth-input').value.trim();
  document.getElementById('auth-error').textContent = '';
  const r = await fetch(WORKER + '?check=1&t=' + encodeURIComponent(token)).catch(() => null);
  if (r && r.ok) { localStorage.setItem('memo_token', token); document.getElementById('auth-overlay').classList.add('hidden'); init(); }
  else document.getElementById('auth-error').textContent = 'Wrong passphrase.';
}
document.getElementById('auth-input').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });

function fileUrl(key) {
  return WORKER + '/memos/' + memoId + '/files/' + key.split('/').map(encodeURIComponent).join('/') + '?t=' + encodeURIComponent(token);
}

async function init() {
  if (!memoId) { location.href = '../'; return; }
  const r = await fetch(WORKER + '?check=1&t=' + encodeURIComponent(token)).catch(() => null);
  if (!r || !r.ok) { document.getElementById('auth-overlay').classList.remove('hidden'); return; }
  document.getElementById('auth-overlay').classList.add('hidden');
  await Promise.all([loadMemo(), loadMeta()]);
  await loadFiles();
  loadNote();
}

async function loadMemo() {
  memo = await (await api('/memos/' + memoId)).json();
  document.title = memo.memo_id;
  document.getElementById('memo-id-badge').textContent = memo.memo_id;
  document.getElementById('title-input').value = memo.title || '';
  document.getElementById('desc-input').value = memo.description || '';
  autoGrow(document.getElementById('desc-input'));
  document.getElementById('pin-btn').classList.toggle('active', !!memo.pinned);
  document.getElementById('uid-input').value = memo.uid || '';
  document.getElementById('uid-hint').textContent = memo.uid || '';
  renderTags(safeJson(memo.tags, []));
  renderLinks(safeJson(memo.links, []));
}

async function loadFiles() {
  allFiles = await (await api('/memos/' + memoId + '/files')).json();
  renderFileList();
  renderGallery();
  renderCoverSelect();
}

async function loadMeta() {
  meta = await (await api('/memos/' + memoId + '/meta')).json();
  meta.files = meta.files || {};
  meta.folders = meta.folders || [];
  meta.trash = meta.trash || [];
  renderFolderNav();
  renderTrash();
}

async function loadNote() {
  const r = await api('/memos/' + memoId + '/note');
  const html = await r.text();
  document.getElementById('note-editor').innerHTML = html;
  const status = html ? 'Saved' : 'No note yet';
  document.getElementById('note-status').textContent = status;
  document.getElementById('note-status-inline').textContent = html ? '' : 'Click to expand…';
}

// ── File list rendering ───────────────────────────────────────────────────────

function getVisibleFiles() {
  let files = allFiles.filter(f => !f.key.startsWith('_'));
  if (currentFolder === '') {
    files = files.filter(f => !f.key.includes('/'));
  } else {
    files = files.filter(f => f.key.startsWith(currentFolder + '/') && !f.key.slice(currentFolder.length + 1).includes('/'));
  }
  const sort = document.getElementById('sort-select').value;
  files.sort((a, b) => {
    if (sort === 'date') return new Date(b.uploaded) - new Date(a.uploaded);
    if (sort === 'size') return b.size - a.size;
    return a.key.localeCompare(b.key);
  });
  return files;
}

function renderFileList() {
  const files = getVisibleFiles();
  const list = document.getElementById('file-list');
  const empty = document.getElementById('file-list-empty');
  list.innerHTML = '';
  empty.style.display = files.length ? 'none' : 'block';

  files.forEach(f => {
    const name = basename(f.key);
    const fm = meta.files[f.key] || {};
    const folderPart = f.key.includes('/') ? f.key.split('/').slice(0, -1).join('/') : '';
    const row = document.createElement('div');
    row.className = 'file-row';

    let thumbOrIcon;
    if (isImg(f.key)) {
      thumbOrIcon = `<img class="file-row-thumb" src="${fileUrl(f.key)}" loading="lazy" alt="" onclick="openLightbox('${esc(f.key)}')">`;
    } else {
      thumbOrIcon = `<div class="file-row-icon">${fileIcon(f.key)}</div>`;
    }

    const folderLabel = folderPart ? `<span class="file-row-folder">${esc(folderPart)}</span>` : '';

    row.innerHTML = `
      ${thumbOrIcon}
      <div class="file-row-name" title="${esc(f.key)}">${esc(name)}${fm.caption ? `<div style="font-size:.7rem;color:var(--muted);font-weight:400">${esc(fm.caption)}</div>` : ''}</div>
      ${folderLabel}
      <div class="file-row-size">${fmtSize(f.size)}</div>
      <div class="file-row-actions">
        <div class="move-wrap">
          <button onclick="showMoveMenu(event,'${esc(f.key)}')">Move ▾</button>
        </div>
        <button onclick="openFileInfo('${esc(f.key)}')">ⓘ</button>
        ${isPreviewable(f.key) ? `<button onclick="${isPdf(f.key) ? `openLightbox('${esc(f.key)}')` : `openLightbox('${esc(f.key)}')`}">View</button>` : `<button onclick="downloadFile('${esc(f.key)}')">↓</button>`}
        <button class="del-btn" onclick="trashFile('${esc(f.key)}')">🗑</button>
      </div>`;
    list.appendChild(row);
  });
}

function renderGallery() {
  const images = allFiles.filter(f => isImg(f.key) && !f.key.startsWith('_'));
  lbFiles = images;
  const section = document.getElementById('gallery-section');
  const gallery = document.getElementById('image-gallery');
  section.style.display = images.length ? '' : 'none';
  document.getElementById('gallery-header').textContent = `Images (${images.length})`;
  gallery.innerHTML = '';
  images.forEach(f => {
    const div = document.createElement('div');
    div.className = 'gallery-thumb';
    div.onclick = () => openLightbox(f.key);
    div.innerHTML = `<img src="${fileUrl(f.key)}" loading="lazy" alt="${esc(basename(f.key))}">`;
    gallery.appendChild(div);
  });
}

function renderFolderNav() {
  const nav = document.getElementById('folder-nav');
  nav.innerHTML = '<button class="folder-pill active" data-folder="" onclick="setFolder(this,\'\')">All Files</button>';
  (meta.folders || []).forEach(folder => {
    const b = document.createElement('button');
    b.className = 'folder-pill'; b.dataset.folder = folder; b.textContent = folder;
    b.onclick = () => setFolder(b, folder);
    nav.appendChild(b);
  });
}

function setFolder(el, folder) {
  currentFolder = folder;
  document.querySelectorAll('.folder-pill').forEach(b => b.classList.toggle('active', b.dataset.folder === folder));
  renderFileList();
}

function renderCoverSelect() {
  const sel = document.getElementById('cover-select');
  const images = allFiles.filter(f => isImg(f.key) && !f.key.startsWith('_'));
  sel.innerHTML = '<option value="">— None —</option>';
  images.forEach(f => {
    const o = document.createElement('option');
    o.value = f.key; o.textContent = f.key;
    if (memo && memo.cover_file === f.key) o.selected = true;
    sel.appendChild(o);
  });
}

function renderTrash() {
  const items = meta.trash || [];
  document.getElementById('trash-count').textContent = items.length ? `${items.length} item${items.length > 1 ? 's' : ''}` : '';
  const list = document.getElementById('trash-list');
  list.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'trash-item';
    div.innerHTML = `
      <div class="trash-item-name">${esc(item.origKey)}</div>
      <div class="trash-item-date">${fmtDate(item.deletedAt)}</div>
      <div class="trash-actions">
        <button class="restore-btn" onclick="restoreFile('${esc(item.trashKey)}','${esc(item.origKey)}')">Restore</button>
        <button class="perm-del-btn" onclick="permDelete('${esc(item.trashKey)}','${esc(item.origKey)}')">Delete</button>
      </div>`;
    list.appendChild(div);
  });
}

// ── Upload (drop zone + input) ────────────────────────────────────────────────

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', async e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  await uploadFiles(Array.from(e.dataTransfer.files));
});
fileInput.addEventListener('change', async () => {
  await uploadFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

async function uploadFiles(files) {
  if (!files.length) return;
  dropZone.querySelector('.drop-zone-text').textContent = `Uploading ${files.length} file${files.length > 1 ? 's' : ''}…`;
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file);
    if (currentFolder) fd.append('folder', currentFolder);
    try { await api('/memos/' + memoId + '/files', { method: 'POST', body: fd }); } catch {}
  }
  dropZone.querySelector('.drop-zone-text').innerHTML = 'Drop files here · or <b>click to browse</b>';
  await loadFiles();
}

// ── Move file ─────────────────────────────────────────────────────────────────

let activeMoveMenu = null;

function showMoveMenu(e, key) {
  e.stopPropagation();
  const menu = document.getElementById('move-menu');
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  menu.style.display = 'block';
  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  menu.style.left = Math.min(rect.left, window.innerWidth - 140) + 'px';
  activeMoveMenu = key;

  const folders = meta.folders || [];
  const currentFileFolder = key.includes('/') ? key.split('/').slice(0, -1).join('/') : '';
  const opts = [];
  if (currentFileFolder !== '') opts.push({ label: '📁 Root', folder: '' });
  folders.forEach(f => { if (f !== currentFileFolder) opts.push({ label: '📁 ' + f, folder: f }); });

  menu.innerHTML = opts.length
    ? opts.map(o => `<button onclick="moveFile('${esc(activeMoveMenu)}','${esc(o.folder)}')">${esc(o.label)}</button>`).join('')
    : '<button disabled style="color:var(--muted);cursor:default">No other folders</button>';
}

document.addEventListener('click', () => { document.getElementById('move-menu').style.display = 'none'; });

async function moveFile(srcKey, dstFolder) {
  document.getElementById('move-menu').style.display = 'none';
  try {
    const r = await api('/memos/' + memoId + '/move', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ srcKey, dstFolder }),
    });
    const { key: newKey } = await r.json();
    // Update meta.files if caption/tags exist
    if (meta.files[srcKey]) { meta.files[newKey] = meta.files[srcKey]; delete meta.files[srcKey]; await saveMeta(); }
    // Update cover_file if needed
    if (memo && memo.cover_file === srcKey) { memo.cover_file = newKey; await saveInfo(); }
    await loadFiles();
  } catch {}
}

// ── Trash / restore ───────────────────────────────────────────────────────────

async function trashFile(key) {
  if (!confirm(`Move "${basename(key)}" to trash?`)) return;
  try {
    const r = await api('/memos/' + memoId + '/trash', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key}) });
    const { trashKey } = await r.json();
    meta.trash = meta.trash || [];
    meta.trash.push({ trashKey, origKey: key, name: basename(key), deletedAt: new Date().toISOString() });
    delete meta.files[key];
    await saveMeta();
    await loadFiles();
    renderTrash();
  } catch {}
}

async function restoreFile(trashKey, origKey) {
  try {
    await api('/memos/' + memoId + '/restore', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trashKey, origKey}) });
    meta.trash = meta.trash.filter(i => i.trashKey !== trashKey);
    await saveMeta();
    await loadFiles();
    renderTrash();
  } catch {}
}

async function permDelete(trashKey, origKey) {
  if (!confirm(`Permanently delete "${basename(origKey)}"? This cannot be undone.`)) return;
  try {
    await api('/memos/' + memoId + '/files/' + trashKey.split('/').map(encodeURIComponent).join('/'), { method:'DELETE' });
    meta.trash = meta.trash.filter(i => i.trashKey !== trashKey);
    await saveMeta();
    renderTrash();
  } catch {}
}

// ── Lightbox ──────────────────────────────────────────────────────────────────

function openLightbox(key) {
  lbIdx = lbFiles.findIndex(f => f.key === key);
  if (lbIdx === -1) { lbFiles = allFiles.filter(f => isPreviewable(f.key)); lbIdx = lbFiles.findIndex(f => f.key === key); }
  if (lbIdx === -1) lbIdx = 0;
  showLightbox();
}

function showLightbox() {
  const f = lbFiles[lbIdx]; if (!f) return;
  document.getElementById('lightbox').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  const content = document.getElementById('lb-content');
  content.innerHTML = isPdf(f.key) ? `<iframe src="${fileUrl(f.key)}"></iframe>` : `<img src="${fileUrl(f.key)}" alt="${esc(basename(f.key))}">`;
  document.getElementById('lb-caption').textContent = basename(f.key);
  document.getElementById('lb-counter').textContent = lbFiles.length > 1 ? `${lbIdx + 1} / ${lbFiles.length}` : '';
  const multi = lbFiles.length > 1;
  document.getElementById('lb-prev').style.display = multi ? '' : 'none';
  document.getElementById('lb-next').style.display = multi ? '' : 'none';
}

function closeLightbox() { document.getElementById('lightbox').classList.add('hidden'); document.getElementById('lb-content').innerHTML = ''; document.body.style.overflow = ''; }
function lbNav(dir) { lbIdx = (lbIdx + dir + lbFiles.length) % lbFiles.length; showLightbox(); }

document.getElementById('lightbox').addEventListener('click', e => { if (e.target === document.getElementById('lightbox')) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').classList.contains('hidden')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});

function downloadFile(key) { const a = document.createElement('a'); a.href = fileUrl(key); a.download = basename(key); a.click(); }

// ── File info modal ───────────────────────────────────────────────────────────

function openFileInfo(key) {
  modalFile = key;
  const fm = meta.files[key] || {};
  document.getElementById('modal-caption').value = fm.caption || '';
  document.getElementById('modal-tags').value = (fm.tags || []).join(', ');
  document.getElementById('info-modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('info-modal').classList.add('hidden'); modalFile = null; }
async function saveFileInfo() {
  if (!modalFile) return;
  meta.files[modalFile] = {
    caption: document.getElementById('modal-caption').value.trim(),
    tags: document.getElementById('modal-tags').value.split(',').map(t => t.trim()).filter(Boolean),
  };
  await saveMeta();
  closeModal();
  renderFileList();
}

// ── Folders ───────────────────────────────────────────────────────────────────

async function addFolder() {
  const name = prompt('Folder name:');
  if (!name) return;
  const safe = name.replace(/[^a-zA-Z0-9_\- ]/g, '').trim();
  if (!safe || (meta.folders || []).includes(safe)) return;
  meta.folders.push(safe);
  await saveMeta();
  renderFolderNav();
}

// ── Notes ─────────────────────────────────────────────────────────────────────

function exec(cmd) { document.getElementById('note-editor').focus(); document.execCommand(cmd, false, null); }
function clearNote() { if (!confirm('Clear the note?')) return; document.getElementById('note-editor').innerHTML = ''; document.getElementById('note-status').textContent = 'Cleared'; }
async function saveNote() {
  const html = document.getElementById('note-editor').innerHTML;
  document.getElementById('note-status').textContent = 'Saving…';
  try {
    await api('/memos/' + memoId + '/note', { method:'PUT', headers:{'Content-Type':'text/plain'}, body:html });
    document.getElementById('note-status').textContent = 'Saved ✓';
  } catch { document.getElementById('note-status').textContent = 'Error'; }
}

// ── Info / Pin ────────────────────────────────────────────────────────────────

async function togglePin() {
  memo.pinned = memo.pinned ? 0 : 1;
  document.getElementById('pin-btn').classList.toggle('active', !!memo.pinned);
  await saveInfo();
}

async function saveInfo() {
  const tags = getTagsFromUI();
  const links = getLinksFromUI();
  try {
    await api('/memos/' + memoId, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        title: document.getElementById('title-input').value.trim(),
        description: document.getElementById('desc-input').value.trim(),
        uid: document.getElementById('uid-input').value.trim(),
        cover_file: document.getElementById('cover-select').value,
        tags, links, pinned: memo ? memo.pinned : 0,
      }),
    });
    if (memo) { memo.uid = document.getElementById('uid-input').value.trim(); document.getElementById('uid-hint').textContent = memo.uid; }
  } catch {}
}

document.getElementById('title-input').addEventListener('change', saveInfo);
document.getElementById('desc-input').addEventListener('change', saveInfo);

// ── Tags UI ───────────────────────────────────────────────────────────────────

function renderTags(tags) {
  currentTags = [...tags];
  const wrap = document.getElementById('tag-wrap');
  wrap.querySelectorAll('.tag-chip').forEach(c => c.remove());
  currentTags.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${esc(t)}<button onclick="removeTag('${esc(t)}')" title="Remove">×</button>`;
    wrap.insertBefore(chip, document.getElementById('tag-text-input'));
  });
}
function removeTag(t) { renderTags(currentTags.filter(x => x !== t)); }
function getTagsFromUI() { return [...currentTags]; }
document.getElementById('tag-text-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,$/, '');
    if (val && !currentTags.includes(val)) { currentTags.push(val); renderTags(currentTags); }
    e.target.value = '';
  }
});

// ── Links UI ──────────────────────────────────────────────────────────────────

function renderLinks(links) {
  const list = document.getElementById('links-list');
  list.innerHTML = '';
  links.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = `<input type="text" placeholder="Label" value="${esc(l.label)}" data-idx="${i}" data-type="label">
      <input type="url" placeholder="URL" value="${esc(l.url)}" data-idx="${i}" data-type="url">
      <button onclick="removeLink(${i})">✕</button>`;
    list.appendChild(row);
  });
}
function addLink() { renderLinks([...getLinksFromUI(), { label:'', url:'' }]); }
function removeLink(i) { const l = getLinksFromUI(); l.splice(i,1); renderLinks(l); }
function getLinksFromUI() {
  return Array.from(document.querySelectorAll('.link-row')).map(row => ({
    label: (row.querySelector('[data-type="label"]') || {}).value || '',
    url: (row.querySelector('[data-type="url"]') || {}).value || '',
  })).filter(l => l.url);
}

// ── Meta ──────────────────────────────────────────────────────────────────────

async function saveMeta() {
  await api('/memos/' + memoId + '/meta', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(meta) });
}

// ── Print label ───────────────────────────────────────────────────────────────

function printLabel() {
  const uid = document.getElementById('uid-input').value.trim() || '—';
  const title = document.getElementById('title-input').value.trim() || 'Untitled';
  const mid = document.getElementById('memo-id-badge').textContent;
  const w = window.open('', '_blank', 'width=400,height=300');
  w.document.write(`<!DOCTYPE html><html><head><title>Label</title>
    <style>body{font-family:monospace;padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
    .mid{font-size:1.2rem;font-weight:bold}.uid{font-size:1rem;color:#444}.title{font-size:.9rem;color:#666}
    @media print{button{display:none}}</style></head><body>
    <div class="mid">${esc(mid)}</div>
    <div class="uid">${esc(uid)}</div>
    <div class="title">${esc(title)}</div>
    <button onclick="window.print()">🖨 Print</button></body></html>`);
  w.document.close();
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function safeJson(s, fb) { try { return typeof s === 'string' ? JSON.parse(s) : (s || fb); } catch { return fb; } }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtSize(b) { if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function fileIcon(name) {
  const e = ext(name);
  if(isPdf(name)) return '📄';
  if(['mp4','mov','avi','mkv','webm'].includes(e)) return '🎬';
  if(['mp3','wav','aac','flac'].includes(e)) return '🎵';
  if(['zip','tar','gz','rar'].includes(e)) return '📦';
  if(['doc','docx'].includes(e)) return '📝';
  if(['xls','xlsx','csv'].includes(e)) return '📊';
  return '📄';
}

init();
</script>
</body>

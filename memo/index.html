<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f4;--surface:#fff;--border:#e7e5e4;
  --text:#1c1917;--muted:#78716c;--accent:#6366f1;--accent-hover:#4f46e5;
  --danger:#ef4444;--danger-light:#fef2f2;--danger-border:#fecaca;
  --success:#22c55e;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:64px}

#auth-overlay{position:fixed;inset:0;background:#1c1917;display:flex;align-items:center;justify-content:center;z-index:3000}
#auth-overlay.hidden{display:none}
.auth-box{background:#fff;border-radius:16px;padding:40px;width:360px;text-align:center}
.auth-box h1{font-size:1.4rem;font-weight:600;margin-bottom:20px}
.auth-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;font-family:inherit;margin-bottom:12px}
.auth-box button{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;font-family:inherit;cursor:pointer;font-weight:500}
#auth-error{color:var(--danger);font-size:.85rem;margin-top:8px;min-height:18px}

.page-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.back-link{color:var(--muted);text-decoration:none;font-size:.85rem;padding:4px 8px;border-radius:6px;flex-shrink:0}
.back-link:hover{background:var(--bg);color:var(--text)}
.memo-id-badge{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--accent);font-weight:500;background:#ede9fe;padding:3px 10px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.header-spacer{flex:1}

.gsearch-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;position:sticky;top:52px;z-index:99}
#gsearch{width:100%;padding:7px 14px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;background:var(--bg);color:var(--text);outline:none}
#gsearch:focus{border-color:var(--accent)}
.gsearch-drop{position:absolute;left:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200;max-height:340px;overflow-y:auto;display:none}
.gsearch-drop.open{display:block}
.gsr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.gsr-item:last-child{border-bottom:none}
.gsr-item:hover,.gsr-item.hi{background:var(--bg)}
.gsr-title{font-size:.9rem;font-weight:600;color:var(--text)}
.gsr-meta{font-size:.75rem;color:var(--accent);font-family:'DM Mono',monospace;margin-top:2px}
.gsr-desc{font-size:.8rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-icon{background:none;border:none;cursor:pointer;padding:5px 7px;border-radius:7px;font-size:.95rem;opacity:.45;line-height:1;transition:opacity .1s;flex-shrink:0}
.btn-icon:hover{opacity:1;background:var(--bg)}
.btn-icon.active{opacity:1}

.title-section{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 14px}
#title-input{width:100%;border:none;outline:none;font-size:1.5rem;font-weight:600;font-family:inherit;color:var(--text);background:transparent;margin-bottom:6px;display:block}
#title-input::placeholder{color:#d4d4d4;font-weight:400}
#desc-input{width:100%;border:none;outline:none;font-size:.9rem;font-family:inherit;color:var(--muted);background:transparent;resize:none;min-height:20px;line-height:1.5;display:block;overflow:hidden}
#desc-input::placeholder{color:#d4d4d4}

/* Quick meta bar (UID + Tags) */
.quick-meta{background:var(--surface);border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qm-uid{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qm-label{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.qm-uid input{border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:.85rem;font-family:inherit;width:150px;color:var(--text);background:transparent}
.qm-uid input:focus{outline:none;border-color:var(--accent)}
.qm-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.qm-tags{display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
.qm-tags .tag-input-wrap{flex:1;padding:4px 8px;min-height:32px}
#note-editor img[data-paste-img]{cursor:pointer;border-radius:4px;display:block;margin:6px 0}
#note-editor img[data-paste-img]:hover{outline:2px solid var(--accent)}

.section{background:var(--surface);border-top:1px solid var(--border)}
.section summary{padding:14px 20px;cursor:pointer;font-size:.85rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;justify-content:space-between;list-style:none;user-select:none}
.section summary::-webkit-details-marker{display:none}
.section summary:hover{color:var(--accent)}
.section summary .s-right{font-size:.75rem;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.section-body{padding:0 20px 20px}

.editor-toolbar{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.editor-toolbar button{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;cursor:pointer;background:transparent;font-family:inherit;color:var(--text);line-height:1.3}
.editor-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 3px;flex-shrink:0}
.tb-color-wrap{position:relative;display:inline-flex;cursor:pointer}
.tb-color-wrap input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0}
.tb-color-preview{padding:3px 7px;border:1px solid var(--border);border-radius:6px;font-size:.85rem;font-weight:700;pointer-events:none;line-height:1.5}
#note-editor{min-height:140px;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.9rem;line-height:1.6;outline:none}
#note-editor:focus{border-color:var(--accent)}
#note-editor ul,#note-editor ol{padding-left:20px}
#note-editor h2{font-size:1.35rem;font-weight:700;margin:8px 0 3px;line-height:1.25}
#note-editor h3{font-size:1.05rem;font-weight:600;margin:6px 0 3px;line-height:1.3}
.note-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
#note-status{font-size:.78rem;color:var(--muted)}
#save-note-btn{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:.85rem;cursor:pointer;font-family:inherit;font-weight:500}

.clip-panel{margin-top:14px;border:1.5px solid var(--accent);border-radius:10px;overflow:hidden}
.clip-panel-head{padding:8px 14px;font-size:.78rem;font-weight:600;color:var(--accent);background:#ede9fe;letter-spacing:.04em}
#clip-title-input{width:100%;border:none;border-bottom:1px solid var(--border);padding:10px 14px;font-size:.9rem;font-family:inherit;background:var(--surface);outline:none;color:var(--text)}
#clip-title-input::placeholder{color:var(--muted)}
#clip-paste-area{min-height:100px;max-height:260px;overflow-y:auto;padding:12px 14px;font-size:.85rem;line-height:1.6;outline:none;background:var(--surface);color:var(--text)}
#clip-paste-area:empty::before{content:'Paste your content here…';color:var(--muted);pointer-events:none}
.clip-foot{display:flex;justify-content:flex-end;gap:8px;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface)}
.clip-foot button{padding:6px 14px;border-radius:7px;font-size:.85rem;cursor:pointer;font-family:inherit;border:1px solid var(--border)}
.clip-foot .clip-save{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.clip-foot .clip-cancel{background:transparent;color:var(--muted)}

.snippets-area{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.snippet-card{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.snippet-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;background:var(--surface);user-select:none}
.snippet-hdr:hover{background:var(--bg)}
.snippet-icon{font-size:1rem;flex-shrink:0}
.snippet-name{font-size:.88rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px;padding:1px 3px;margin:-1px -3px;outline:none}
.snippet-name:focus{background:var(--bg);box-shadow:0 0 0 2px var(--accent);white-space:normal;overflow:visible}
.snippet-ts{font-size:.72rem;color:var(--muted);flex-shrink:0;font-family:'DM Mono',monospace}
.snippet-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.8rem;padding:2px 6px;border-radius:4px;flex-shrink:0;line-height:1}
.snippet-del:hover{background:var(--danger-light);color:var(--danger)}
.snippet-chev{font-size:.75rem;color:var(--muted);flex-shrink:0;transition:transform .15s}
.snippet-chev.open{transform:rotate(90deg)}
.snippet-body{border-top:1px solid var(--border);background:#fafaf9}
.snippet-content{padding:14px;max-height:320px;overflow-y:auto;font-size:.85rem;line-height:1.6;word-break:break-word}
.snippet-foot{display:flex;justify-content:flex-end;padding:6px 14px;border-top:1px solid var(--border)}
.snippet-foot button{padding:4px 12px;border:1px solid var(--border);border-radius:6px;font-size:.78rem;cursor:pointer;background:transparent;font-family:inherit;color:var(--muted)}
.snippet-foot button:hover{border-color:var(--accent);color:var(--accent)}

.field-group{margin-bottom:14px}
.field-label{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.field-input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;font-family:inherit;color:var(--text)}
.field-input:focus{outline:none;border-color:var(--accent)}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:text;min-height:38px;align-items:center}
.tag-input-wrap:focus-within{border-color:var(--accent)}
.tag-chip{display:inline-flex;align-items:center;gap:4px;background:#ede9fe;color:var(--accent);border-radius:12px;padding:2px 8px;font-size:.78rem}
.tag-chip button{background:none;border:none;cursor:pointer;color:inherit;padding:0;font-size:.85rem;line-height:1}
#tag-text-input{border:none;outline:none;font-size:.85rem;font-family:inherit;min-width:80px;flex:1}
.links-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.link-row{display:flex;gap:8px;align-items:center}
.link-row input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:.83rem;font-family:inherit}
.link-row input:focus{outline:none;border-color:var(--accent)}
.link-row button{padding:5px 9px;border:1px solid var(--border);border-radius:7px;font-size:.8rem;cursor:pointer;background:transparent;color:var(--muted)}
.link-row button:hover{border-color:var(--danger);color:var(--danger)}
.link-open-btn{padding:5px 8px;border:1px solid var(--border);border-radius:7px;font-size:.8rem;color:var(--muted);text-decoration:none;line-height:1;flex-shrink:0}
.link-open-btn:hover{border-color:var(--accent);color:var(--accent)}
#add-link-btn{padding:6px 12px;border:1px dashed var(--border);border-radius:7px;font-size:.82rem;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit}
#add-link-btn:hover{border-color:var(--accent);color:var(--accent)}
#save-info-btn{padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;font-family:inherit;font-weight:500}
#cover-select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit}

/* File browser */
.file-browser{background:var(--surface);margin-top:8px}

.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg);margin:12px 20px}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:#f5f3ff}
.drop-zone-icon{font-size:1.1rem;opacity:.4;margin-bottom:2px}
.drop-zone-text{font-size:.82rem;color:var(--muted)}
.drop-zone-text b{color:var(--accent);font-weight:500}

.fb-toolbar{border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.fb-label{font-size:.9rem;font-weight:600;white-space:nowrap}
.fb-size{font-size:.78rem;color:var(--muted);white-space:nowrap}
.view-btn{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:.9rem;line-height:1;color:var(--muted)}
.view-btn.active{background:#1c1917;border-color:#1c1917;color:#fff}
.view-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}
#sort-select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:.8rem;font-family:inherit;background:var(--surface);color:var(--text)}
.sort-dir-btn{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:.85rem;color:var(--muted)}
.sort-dir-btn:hover{border-color:var(--accent);color:var(--accent)}
.fb-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:.83rem;font-family:inherit;cursor:pointer;color:var(--text);white-space:nowrap;font-weight:500}
.fb-btn:hover{border-color:var(--accent);color:var(--accent)}
.fb-btn-primary{background:#1c1917;border-color:#1c1917;color:#fff}
.fb-btn-primary:hover{background:#292524;border-color:#292524;color:#fff}
.fb-btn-danger{background:var(--danger-light);border-color:var(--danger-border);color:var(--danger)}
.fb-btn-danger:hover{background:#fee2e2;border-color:var(--danger)}

.breadcrumb{padding:9px 20px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);font-size:.85rem;background:var(--surface)}
.bc-back{background:none;border:none;cursor:pointer;color:var(--accent);font-size:.85rem;font-family:inherit;padding:0;text-decoration:none}
.bc-back:hover{text-decoration:underline}
.bc-sep{color:var(--muted);opacity:.5}
.bc-current{font-weight:600;color:var(--text)}

.select-bar{padding:8px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--surface)}
.sel-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:.78rem;cursor:pointer;background:transparent;font-family:inherit;color:var(--muted)}
.sel-btn:hover{border-color:var(--accent);color:var(--accent)}
#sel-count{font-size:.78rem;color:var(--accent);font-weight:500}

#file-list{background:var(--surface)}
.file-list-empty{padding:28px;text-align:center;color:var(--muted);font-size:.85rem}

/* List rows */
.file-row{display:flex;align-items:center;padding:9px 20px;gap:12px;border-bottom:1px solid var(--border);transition:background .1s}
.file-row:last-child{border-bottom:none}
.file-row:hover{background:#fafaf9}
.file-row.selected{background:#f5f3ff}
.file-row.folder-row{cursor:default}
.file-row.drag-over{background:#ede9fe !important;outline:2px solid var(--accent) inset}
.file-cb{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:transparent;transition:all .12s}
.file-cb:hover{border-color:var(--accent)}
.file-row.selected .file-cb{background:var(--accent);border-color:var(--accent);color:#fff}
.file-row-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;cursor:pointer}
.file-row-icon{font-size:1.5rem;flex-shrink:0;width:40px;text-align:center;line-height:40px}
.folder-icon-box{width:40px;height:40px;background:#ede9fe;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}
.file-row-info{flex:1;min-width:0}
.file-row-name{font-size:.85rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row-meta{font-size:.72rem;color:var(--muted);margin-top:2px}
.file-row-actions{display:flex;gap:4px;flex-shrink:0}
.file-row-actions button{padding:3px 9px;border:1px solid var(--border);border-radius:6px;font-size:.72rem;cursor:pointer;background:transparent;font-family:inherit;color:var(--muted)}
.file-row-actions button:hover{border-color:var(--accent);color:var(--accent)}
.file-row-actions .del-btn:hover{border-color:var(--danger);color:var(--danger)}

/* Grid mode */
#file-list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:16px 20px;background:var(--bg)}
.file-grid-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.file-grid-card.selected{outline:2px solid var(--accent)}
.file-grid-card.drag-over{outline:2px solid var(--accent);background:#f5f3ff}
.grid-cb{position:absolute;top:7px;left:7px;width:20px;height:20px;border:2px solid rgba(255,255,255,.85);border-radius:5px;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:transparent;z-index:2;cursor:pointer;transition:all .12s}
.file-grid-card.selected .grid-cb{background:var(--accent);border-color:var(--accent);color:#fff}
.grid-thumb{height:110px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.grid-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.grid-icon{font-size:2.2rem;opacity:.4}
.folder-grid-thumb{height:110px;background:#ede9fe;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:2.8rem}
.grid-info{padding:8px 10px}
.grid-name{font-size:.78rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-meta{font-size:.7rem;color:var(--muted);margin-top:2px}
.grid-menu-btn{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.35);border:none;color:#fff;width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;z-index:2;opacity:0;transition:opacity .15s}
.file-grid-card:hover .grid-menu-btn{opacity:1}

/* Gallery */
.gallery-section{padding:12px 20px 16px;background:var(--surface);border-top:1px solid var(--border)}
.gallery-header{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.image-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.gallery-thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--bg)}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .15s}
.gallery-thumb:hover img{transform:scale(1.06)}

/* Bulk bar */
.bulk-bar{position:fixed;bottom:0;left:0;right:0;background:#1c1917;color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;z-index:500;transform:translateY(100%);transition:transform .2s ease;box-shadow:0 -2px 12px rgba(0,0,0,.25)}
.bulk-bar.visible{transform:translateY(0)}
.bulk-count{font-size:.88rem;font-weight:600;padding-right:16px;border-right:1px solid rgba(255,255,255,.2);margin-right:14px;white-space:nowrap}
.bulk-sep{color:rgba(255,255,255,.25);margin:0 10px}
.bulk-action{background:none;border:none;color:#fff;cursor:pointer;font-size:.88rem;font-family:inherit;padding:4px 0;opacity:.8}
.bulk-action:hover{opacity:1}
.bulk-del{color:#fca5a5}
.bulk-cancel{margin-left:auto;opacity:.5;font-size:.82rem}
.bulk-cancel:hover{opacity:1}

/* Float menu */
.float-menu{display:none;position:fixed;z-index:700;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.14);min-width:150px;overflow:hidden}
.float-menu button{display:block;width:100%;text-align:left;padding:9px 14px;border:none;background:transparent;font-size:.83rem;font-family:inherit;cursor:pointer;color:var(--text)}
.float-menu button:hover{background:var(--bg);color:var(--accent)}
.float-menu button.danger:hover{color:var(--danger)}
.float-menu .menu-divider{height:1px;background:var(--border)}

/* Modal base */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-overlay.hidden{display:none}
.modal-box{background:#fff;border-radius:14px;padding:24px;width:100%;max-height:90vh;display:flex;flex-direction:column}
.modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;flex-shrink:0}
.modal-hdr h3{font-size:1rem;font-weight:600}
.modal-hdr .modal-sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.modal-close{background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--muted);padding:2px 6px;border-radius:6px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-scroll{overflow-y:auto;flex:1;margin:12px -24px 0;padding:0 24px}
.modal-ftr{display:flex;align-items:center;margin-top:16px;flex-shrink:0;gap:8px}
.modal-ftr-left{display:flex;gap:8px;flex:1}
.btn-cancel{padding:7px 16px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);font-family:inherit;font-size:.85rem;cursor:pointer;font-weight:500}
.btn-cancel:hover{border-color:var(--text);color:var(--text)}
.btn-save{padding:7px 16px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-family:inherit;font-size:.85rem;cursor:pointer;font-weight:500}
.btn-save:hover{background:var(--accent-hover)}
.btn-danger-sm{padding:7px 14px;border-radius:8px;background:var(--danger-light);color:var(--danger);border:1px solid var(--danger-border);font-family:inherit;font-size:.85rem;cursor:pointer;font-weight:500}
.btn-danger-sm:hover{background:#fee2e2}

/* Trash modal */
.trash-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.trash-item:last-child{border-bottom:none}
.trash-thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;flex-shrink:0}
.trash-icon{width:38px;height:38px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.trash-info{flex:1;min-width:0}
.trash-name{font-size:.83rem;font-weight:500;word-break:break-all}
.trash-meta{font-size:.72rem;color:var(--muted);margin-top:2px}
.trash-acts{display:flex;gap:6px;flex-shrink:0}
.restore-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:.75rem;cursor:pointer;background:transparent;font-family:inherit}
.restore-btn:hover{border-color:var(--success);color:var(--success)}
.perm-del-btn{padding:4px 10px;border:1px solid var(--danger-border);border-radius:6px;font-size:.75rem;cursor:pointer;background:var(--danger-light);color:var(--danger);font-family:inherit}
.perm-del-btn:hover{background:#fee2e2}

/* File info modal */
.file-info-modal label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:4px;margin-top:14px}
.file-info-modal input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-size:.9rem;font-family:inherit}
.file-info-modal input:focus{outline:none;border-color:var(--accent)}

/* Lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2500;display:flex;align-items:center;justify-content:center}
#lightbox.hidden{display:none}
#lb-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;opacity:.7;z-index:10}
#lb-close:hover{opacity:1}
#lb-prev,#lb-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;font-size:2rem;cursor:pointer;padding:12px 16px;border-radius:8px;z-index:10;line-height:1}
#lb-prev{left:16px}#lb-next{right:16px}
#lb-prev:hover,#lb-next:hover{background:rgba(255,255,255,.22)}
#lb-content img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:4px;display:block}
#lb-content iframe{width:80vw;height:85vh;border:none;border-radius:4px;background:#fff;display:block}
#lb-caption{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.75);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80vw}
#lb-counter{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.55);font-size:.78rem}

/* Hover preview */
#hover-preview{position:fixed;z-index:900;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.22);overflow:hidden;pointer-events:none;display:none;width:260px;height:260px}
#hover-preview img{width:100%;height:100%;object-fit:contain;display:block}

</style>
</head>

<script>
const WORKER = 'https://memo-worker.ausz.workers.dev';
let token = localStorage.getItem('memo_token') || '';
const params = new URLSearchParams(location.search);
const memoId = params.get('id');

let memo = null, meta = {files:{},folders:[],trash:[]}, allFiles = [];
let currentFolder = '', lbFiles = [], lbIdx = 0, modalFile = null, currentTags = [];
const selectedFiles = new Set();
let viewMode = localStorage.getItem('memo_view') || 'list';
let sortDir = 1;
let dragKey = null;

const IMG_EXTS = new Set(['jpg','jpeg','png','gif','webp','heic','avif','bmp','svg','tiff']);
const isImg = n => IMG_EXTS.has(ext(n));
const isPdf = n => ext(n) === 'pdf';
const isPreviewable = n => isImg(n) || isPdf(n);
const ext = n => (n.split('.').pop()||'').toLowerCase();
const basename = n => n.split('/').pop();

function api(path, opts={}) {
  const sep = path.includes('?') ? '&' : '?';
  return fetch(WORKER + path + sep + 't=' + encodeURIComponent(token), opts).then(r => {
    if (r.status === 401) { logout(); throw new Error('unauthorized'); }
    return r;
  });
}
function logout() { localStorage.removeItem('memo_token'); token = ''; document.getElementById('auth-overlay').classList.remove('hidden'); }

async function doAuth() {
  token = document.getElementById('auth-input').value.trim();
  document.getElementById('auth-error').textContent = '';
  const r = await fetch(WORKER + '?check=1&t=' + encodeURIComponent(token)).catch(() => null);
  if (r && r.ok) { localStorage.setItem('memo_token', token); document.getElementById('auth-overlay').classList.add('hidden'); init(); }
  else document.getElementById('auth-error').textContent = 'Wrong passphrase.';
}
document.getElementById('auth-input').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });

function fileUrl(key) {
  return WORKER + '/memos/' + memoId + '/files/' + key.split('/').map(encodeURIComponent).join('/') + '?t=' + encodeURIComponent(token);
}

async function init() {
  if (!memoId) { location.href = '../'; return; }
  const r = await fetch(WORKER + '?check=1&t=' + encodeURIComponent(token)).catch(() => null);
  if (!r || !r.ok) { document.getElementById('auth-overlay').classList.remove('hidden'); return; }
  document.getElementById('auth-overlay').classList.add('hidden');
  setView(viewMode, false);
  await Promise.all([loadMemo(), loadMeta()]);
  await loadFiles();
  loadNote();
  loadSnippets();
}

async function loadMemo() {
  memo = await (await api('/memos/' + memoId)).json();
  document.title = memo.memo_id;
  document.getElementById('memo-id-badge').textContent = memo.memo_id;
  document.getElementById('title-input').value = memo.title || '';
  document.getElementById('desc-input').value = memo.description || '';
  autoGrow(document.getElementById('desc-input'));
  document.getElementById('pin-btn').classList.toggle('active', !!memo.pinned);
  document.getElementById('uid-input').value = memo.uid || '';
  renderTags(safeJson(memo.tags, []));
  renderLinks(safeJson(memo.links, []));
}

async function loadFiles() {
  allFiles = await (await api('/memos/' + memoId + '/files')).json();
  renderFileList();
  renderGallery();
  renderCoverSelect();
  const total = allFiles.reduce((s, f) => s + f.size, 0);
  document.getElementById('fb-size').textContent = allFiles.length ? fmtSize(total) : '';
}

async function loadMeta() {
  meta = await (await api('/memos/' + memoId + '/meta')).json();
  meta.files = meta.files || {}; meta.folders = meta.folders || []; meta.trash = meta.trash || [];
  renderTrashCount();
}

async function loadNote() {
  const r = await api('/memos/' + memoId + '/note');
  const html = await r.text();
  document.getElementById('note-editor').innerHTML = html;
  document.getElementById('note-status').textContent = html ? 'Saved' : 'No note yet';
  document.getElementById('note-hint').textContent = html ? '' : 'Click to expand…';
}

// ── View & Sort ───────────────────────────────────────────────────────────────

function setView(mode, save = true) {
  viewMode = mode;
  if (save) localStorage.setItem('memo_view', mode);
  document.getElementById('view-list-btn').classList.toggle('active', mode === 'list');
  document.getElementById('view-grid-btn').classList.toggle('active', mode === 'grid');
  const list = document.getElementById('file-list');
  if (mode === 'grid') list.classList.add('grid');
  else list.classList.remove('grid');
  renderFileList();
}

function toggleSortDir() {
  sortDir *= -1;
  document.getElementById('sort-dir-btn').textContent = sortDir === 1 ? '▲' : '▼';
  renderFileList();
}

// ── File list rendering ───────────────────────────────────────────────────────

function getVisibleFiles() {
  let files = allFiles.filter(f => !f.key.startsWith('_'));
  if (currentFolder === '') files = files.filter(f => !f.key.includes('/'));
  else files = files.filter(f => f.key.startsWith(currentFolder + '/') && !f.key.slice(currentFolder.length + 1).includes('/'));
  const sort = document.getElementById('sort-select').value;
  files.sort((a, b) => {
    let v = sort === 'date' ? new Date(a.uploaded) - new Date(b.uploaded)
          : sort === 'size' ? a.size - b.size
          : a.key.localeCompare(b.key);
    return v * sortDir;
  });
  return files;
}

function renderFileList() {
  const list = document.getElementById('file-list');
  list.innerHTML = '';

  // Breadcrumb
  const bc = document.getElementById('breadcrumb');
  if (currentFolder) {
    bc.style.display = '';
    document.getElementById('bc-folder-name').textContent = currentFolder;
  } else {
    bc.style.display = 'none';
  }

  const files = getVisibleFiles();
  const folders = meta.folders || [];

  if (viewMode === 'grid') {
    // Folder cards at root
    if (!currentFolder) {
      folders.forEach(folder => {
        const count = allFiles.filter(f => f.key.startsWith(folder + '/') && !f.key.startsWith('_')).length;
        const card = document.createElement('div');
        card.className = 'file-grid-card';
        card.dataset.folder = folder;
        card.innerHTML = `
          <div class="folder-grid-thumb" onclick="setFolder('${esc(folder)}')">📁</div>
          <div class="grid-info">
            <div class="grid-name">${esc(folder)}</div>
            <div class="grid-meta">${count} item${count !== 1 ? 's' : ''}</div>
          </div>
          <button class="grid-menu-btn" onclick="showFolderMenu(event,'${esc(folder)}')">⋯</button>`;
        addFolderDropTarget(card, folder);
        list.appendChild(card);
      });
    }
    // File cards
    files.forEach(f => {
      const name = basename(f.key);
      const card = document.createElement('div');
      card.className = 'file-grid-card' + (selectedFiles.has(f.key) ? ' selected' : '');
      card.dataset.key = f.key;
      const thumbHtml = isImg(f.key)
        ? `<img src="${fileUrl(f.key)}" loading="lazy" alt="" data-preview="1">`
        : `<div class="grid-icon">${fileIcon(f.key)}</div>`;
      card.innerHTML = `
        <div class="grid-cb" onclick="toggleSelect('${esc(f.key)}');event.stopPropagation()">✓</div>
        <div class="grid-thumb" onclick="${isPreviewable(f.key) ? `openLightbox('${esc(f.key)}')` : `downloadFile('${esc(f.key)}')`}">${thumbHtml}</div>
        <div class="grid-info"><div class="grid-name" title="${esc(f.key)}">${esc(name)}</div><div class="grid-meta">${fmtSize(f.size)}</div></div>
        <button class="grid-menu-btn" onclick="showFileMenu(event,'${esc(f.key)}')">⋯</button>`;
      addFileDrag(card, f.key);
      list.appendChild(card);
    });
  } else {
    // Folder rows at root
    if (!currentFolder) {
      folders.forEach(folder => {
        const count = allFiles.filter(f => f.key.startsWith(folder + '/') && !f.key.startsWith('_')).length;
        const row = document.createElement('div');
        row.className = 'file-row folder-row';
        row.dataset.folder = folder;
        row.innerHTML = `
          <div style="width:20px;flex-shrink:0"></div>
          <div class="folder-icon-box">📁</div>
          <div class="file-row-info" style="cursor:pointer" onclick="setFolder('${esc(folder)}')">
            <div class="file-row-name">${esc(folder)}</div>
            <div class="file-row-meta">${count} item${count !== 1 ? 's' : ''}</div>
          </div>
          <div class="file-row-actions">
            <button onclick="showFolderMenu(event,'${esc(folder)}')">⋯</button>
          </div>`;
        addFolderDropTarget(row, folder);
        list.appendChild(row);
      });
    }
    // File rows
    files.forEach(f => {
      const name = basename(f.key);
      const fm = meta.files[f.key] || {};
      const folderPart = f.key.includes('/') ? f.key.split('/').slice(0, -1).join('/') : '';
      const row = document.createElement('div');
      row.className = 'file-row' + (selectedFiles.has(f.key) ? ' selected' : '');
      row.dataset.key = f.key;
      const thumbHtml = isImg(f.key)
        ? `<img class="file-row-thumb" src="${fileUrl(f.key)}" loading="lazy" alt="" data-preview="1" onclick="openLightbox('${esc(f.key)}')">`
        : `<div class="file-row-icon">${fileIcon(f.key)}</div>`;
      row.innerHTML = `
        <div class="file-cb" onclick="toggleSelect('${esc(f.key)}')">✓</div>
        ${thumbHtml}
        <div class="file-row-info">
          <div class="file-row-name" title="${esc(name)}">${esc(name)}</div>
          <div class="file-row-meta">${folderPart ? `${esc(folderPart)} · ` : ''}${fmtSize(f.size)} · ${fmtDate(f.uploaded)}${fm.caption ? ` · <em>${esc(fm.caption)}</em>` : ''}${fm.tags?.length ? ` · <span style="color:var(--accent)">Tags: ${fm.tags.map(t => esc(t)).join(', ')}</span>` : ''}</div>
        </div>
        <div class="file-row-actions">
          <button onclick="showMoveMenu(event,'${esc(f.key)}')">Move ▾</button>
          <button onclick="openFileInfo('${esc(f.key)}')">ⓘ</button>
          ${isPreviewable(f.key) ? `<button onclick="openLightbox('${esc(f.key)}')">View</button>` : `<button onclick="downloadFile('${esc(f.key)}')">↓</button>`}
          <button class="del-btn" onclick="trashFile('${esc(f.key)}')">🗑</button>
        </div>`;
      addFileDrag(row, f.key);
      list.appendChild(row);
    });
  }

  const showEmpty = files.length === 0 && (currentFolder !== '' || folders.length === 0);
  document.getElementById('file-list-empty').style.display = showEmpty ? 'block' : 'none';
  updateSelectionUI();
}

function addFileDrag(el, key) {
  el.draggable = true;
  el.addEventListener('dragstart', e => {
    dragKey = key;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', key);
  });
  el.addEventListener('dragend', () => { dragKey = null; });
}

function addFolderDropTarget(el, folder) {
  el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; el.classList.add('drag-over'); });
  el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over'); });
  el.addEventListener('drop', async e => {
    e.preventDefault(); el.classList.remove('drag-over');
    const key = dragKey || e.dataTransfer.getData('text/plain');
    if (key && !key.startsWith('_')) { dragKey = null; await moveFile(key, folder); }
  });
}

function setFolder(folder) {
  currentFolder = folder;
  selectedFiles.clear();
  renderFileList();
}

function renderGallery() {
  const images = allFiles.filter(f => isImg(f.key) && !f.key.startsWith('_'));
  lbFiles = images;
  const section = document.getElementById('gallery-section');
  section.style.display = images.length ? '' : 'none';
  document.getElementById('gallery-header').textContent = `Images (${images.length})`;
  const gallery = document.getElementById('image-gallery');
  gallery.innerHTML = '';
  images.forEach(f => {
    const div = document.createElement('div'); div.className = 'gallery-thumb';
    div.onclick = () => openLightbox(f.key);
    div.innerHTML = `<img src="${fileUrl(f.key)}" loading="lazy" alt="${esc(basename(f.key))}">`;
    gallery.appendChild(div);
  });
}

function renderCoverSelect() {
  const sel = document.getElementById('cover-select');
  const images = allFiles.filter(f => isImg(f.key) && !f.key.startsWith('_'));
  sel.innerHTML = '<option value="">— None —</option>';
  images.forEach(f => {
    const o = document.createElement('option'); o.value = f.key; o.textContent = f.key;
    if (memo && memo.cover_file === f.key) o.selected = true;
    sel.appendChild(o);
  });
}

function renderTrashCount() {
  const n = (meta.trash || []).length;
  document.getElementById('trash-count-btn').textContent = n;
}

// ── Trash modal ───────────────────────────────────────────────────────────────

function openTrashModal() {
  const items = meta.trash || [];
  const n = items.length;
  document.getElementById('trash-modal-sub').textContent = n ? `${n} item${n !== 1 ? 's' : ''}` : 'Empty';
  const listEl = document.getElementById('trash-modal-list');
  listEl.innerHTML = '';
  if (!n) { listEl.innerHTML = '<div style="padding:20px 0;text-align:center;color:var(--muted);font-size:.85rem">Trash is empty</div>'; }
  items.forEach(item => {
    const div = document.createElement('div'); div.className = 'trash-item';
    const thumbHtml = isImg(item.origKey)
      ? `<img class="trash-thumb" src="${fileUrl(item.trashKey)}" loading="lazy" alt="" onerror="this.style.display='none'">`
      : `<div class="trash-icon">${fileIcon(item.origKey)}</div>`;
    div.innerHTML = `${thumbHtml}
      <div class="trash-info">
        <div class="trash-name">${esc(basename(item.origKey))}</div>
        <div class="trash-meta">${item.origKey.includes('/') ? esc(item.origKey.split('/').slice(0,-1).join('/')) : 'root'} · ${fmtDate(item.deletedAt)}</div>
      </div>
      <div class="trash-acts">
        <button class="restore-btn" onclick="restoreFile('${esc(item.trashKey)}','${esc(item.origKey)}')">Restore</button>
        <button class="perm-del-btn" onclick="permDelete('${esc(item.trashKey)}','${esc(item.origKey)}')">Delete</button>
      </div>`;
    listEl.appendChild(div);
  });
  document.getElementById('trash-modal').classList.remove('hidden');
}

function closeTrashModal() { document.getElementById('trash-modal').classList.add('hidden'); }

async function emptyTrash() {
  const items = meta.trash || [];
  if (!items.length) return;
  if (!confirm(`Permanently delete all ${items.length} items in trash? This cannot be undone.`)) return;
  for (const item of items) {
    try { await api('/memos/' + memoId + '/files/' + item.trashKey.split('/').map(encodeURIComponent).join('/'), { method: 'DELETE' }); } catch {}
  }
  meta.trash = [];
  await saveMeta();
  renderTrashCount();
  closeTrashModal();
}

async function restoreAll() {
  const items = [...(meta.trash || [])];
  if (!items.length) return;
  for (const item of items) {
    try {
      await api('/memos/' + memoId + '/restore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashKey: item.trashKey, origKey: item.origKey }) });
      meta.trash = meta.trash.filter(i => i.trashKey !== item.trashKey);
    } catch {}
  }
  await saveMeta(); await loadFiles();
  renderTrashCount(); closeTrashModal();
}

async function restoreFile(trashKey, origKey) {
  try {
    await api('/memos/' + memoId + '/restore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashKey, origKey }) });
    meta.trash = meta.trash.filter(i => i.trashKey !== trashKey);
    await saveMeta(); await loadFiles();
    renderTrashCount(); openTrashModal();
  } catch {}
}

async function permDelete(trashKey, origKey) {
  if (!confirm(`Permanently delete "${basename(origKey)}"?`)) return;
  try {
    await api('/memos/' + memoId + '/files/' + trashKey.split('/').map(encodeURIComponent).join('/'), { method: 'DELETE' });
    meta.trash = meta.trash.filter(i => i.trashKey !== trashKey);
    await saveMeta();
    renderTrashCount(); openTrashModal();
  } catch {}
}

// ── Selection ─────────────────────────────────────────────────────────────────

function toggleSelect(key) { if (selectedFiles.has(key)) selectedFiles.delete(key); else selectedFiles.add(key); updateSelectionUI(); }
function selectAll() { getVisibleFiles().forEach(f => selectedFiles.add(f.key)); updateSelectionUI(); }
function deselectAll() { selectedFiles.clear(); updateSelectionUI(); }
function updateSelectionUI() {
  const count = selectedFiles.size;
  document.querySelectorAll('[data-key]').forEach(el => el.classList.toggle('selected', selectedFiles.has(el.dataset.key)));
  document.getElementById('sel-count').textContent = count ? `${count} selected` : '';
  document.getElementById('bulk-count').textContent = `${count} selected`;
  document.getElementById('bulk-bar').classList.toggle('visible', count > 0);
}

// ── Float menu ────────────────────────────────────────────────────────────────

function showFloatMenu(e, items) {
  e.stopPropagation();
  const menu = document.getElementById('float-menu');
  menu.innerHTML = items.map(item =>
    item === '---' ? '<div class="menu-divider"></div>'
    : `<button class="${item.danger ? 'danger' : ''}" onclick="${item.fn}">${esc(item.label)}</button>`
  ).join('');
  menu.style.display = 'block';
  const rect = e.currentTarget.getBoundingClientRect();
  let left = rect.left, top = rect.bottom + 4;
  if (left + 170 > window.innerWidth) left = window.innerWidth - 175;
  if (top + items.length * 40 > window.innerHeight) top = rect.top - items.length * 40 - 4;
  menu.style.left = left + 'px'; menu.style.top = top + 'px';
}
document.addEventListener('click', () => { document.getElementById('float-menu').style.display = 'none'; });

function showMoveMenu(e, key) {
  const folders = meta.folders || [];
  const cur = key.includes('/') ? key.split('/').slice(0,-1).join('/') : '';
  const items = [];
  if (cur !== '') items.push({ label: '📁 Root', fn: `moveFile('${esc(key)}','')` });
  folders.forEach(f => { if (f !== cur) items.push({ label: '📁 ' + f, fn: `moveFile('${esc(key)}','${esc(f)}')` }); });
  if (!items.length) items.push({ label: 'No other folders', fn: 'void 0' });
  showFloatMenu(e, items);
}

function showBulkMoveMenu(e) {
  if (!selectedFiles.size) return;
  const folders = meta.folders || [];
  const items = [{ label: '📁 Root', fn: `bulkMoveTo('')` }];
  folders.forEach(f => items.push({ label: '📁 ' + f, fn: `bulkMoveTo('${esc(f)}')` }));
  if (!folders.length) items.push({ label: 'No folders yet', fn: 'void 0' });
  showFloatMenu(e, items);
}

function showFileMenu(e, key) {
  showFloatMenu(e, [
    { label: 'View / Preview', fn: `openLightbox('${esc(key)}')` },
    { label: 'File info', fn: `openFileInfo('${esc(key)}')` },
    { label: 'Move to…', fn: `showMoveMenu(event,'${esc(key)}')` },
    '---',
    { label: '🗑 Move to trash', fn: `trashFile('${esc(key)}')`, danger: true },
  ]);
}

function showFolderMenu(e, folder) {
  showFloatMenu(e, [
    { label: '✏️ Rename', fn: `renameFolder('${esc(folder)}')` },
    { label: '🗑 Remove folder', fn: `removeFolder('${esc(folder)}')`, danger: true },
  ]);
}

// ── Move ──────────────────────────────────────────────────────────────────────

async function moveFile(srcKey, dstFolder) {
  try {
    const r = await api('/memos/' + memoId + '/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ srcKey, dstFolder }) });
    const { key: newKey } = await r.json();
    if (meta.files[srcKey]) { meta.files[newKey] = meta.files[srcKey]; delete meta.files[srcKey]; }
    if (memo && memo.cover_file === srcKey) { memo.cover_file = newKey; await saveInfo(); }
    await saveMeta(); await loadFiles();
  } catch {}
}

async function bulkMoveTo(folder) {
  const keys = [...selectedFiles];
  for (const key of keys) {
    try {
      const r = await api('/memos/' + memoId + '/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ srcKey: key, dstFolder: folder }) });
      const { key: newKey } = await r.json();
      if (meta.files[key]) { meta.files[newKey] = meta.files[key]; delete meta.files[key]; }
    } catch {}
  }
  selectedFiles.clear(); await saveMeta(); await loadFiles();
}

// ── Upload ────────────────────────────────────────────────────────────────────

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', async e => { e.preventDefault(); dropZone.classList.remove('drag-over'); await uploadFiles(Array.from(e.dataTransfer.files)); });
fileInput.addEventListener('change', async () => { await uploadFiles(Array.from(fileInput.files)); fileInput.value = ''; });

async function uploadFiles(files) {
  if (!files.length) return;
  const txt = document.getElementById('drop-zone-text');
  txt.innerHTML = `Uploading ${files.length} file${files.length > 1 ? 's' : ''}…`;
  for (const file of files) {
    const fd = new FormData(); fd.append('file', file);
    if (currentFolder) fd.append('folder', currentFolder);
    try { await api('/memos/' + memoId + '/files', { method: 'POST', body: fd }); } catch {}
  }
  txt.innerHTML = 'Drop files here · or <b>click to browse</b>';
  await loadFiles();
}

// ── Trash / Clear all ─────────────────────────────────────────────────────────

async function trashFile(key) {
  if (!confirm(`Move "${basename(key)}" to trash?`)) return;
  try {
    const r = await api('/memos/' + memoId + '/trash', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
    const { trashKey } = await r.json();
    meta.trash.push({ trashKey, origKey: key, name: basename(key), deletedAt: new Date().toISOString() });
    delete meta.files[key];
    await saveMeta(); await loadFiles(); renderTrashCount();
  } catch {}
}

async function bulkTrash() {
  const keys = [...selectedFiles]; if (!keys.length) return;
  if (!confirm(`Move ${keys.length} file${keys.length > 1 ? 's' : ''} to trash?`)) return;
  for (const key of keys) {
    try {
      const r = await api('/memos/' + memoId + '/trash', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
      const { trashKey } = await r.json();
      meta.trash.push({ trashKey, origKey: key, name: basename(key), deletedAt: new Date().toISOString() });
      delete meta.files[key];
    } catch {}
  }
  selectedFiles.clear(); await saveMeta(); await loadFiles(); renderTrashCount();
}

async function clearAll() {
  const files = getVisibleFiles(); if (!files.length) return;
  if (!confirm(`Move all ${files.length} visible files to trash?`)) return;
  for (const f of files) {
    try {
      const r = await api('/memos/' + memoId + '/trash', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: f.key }) });
      const { trashKey } = await r.json();
      meta.trash.push({ trashKey, origKey: f.key, name: basename(f.key), deletedAt: new Date().toISOString() });
      delete meta.files[f.key];
    } catch {}
  }
  await saveMeta(); await loadFiles(); renderTrashCount();
}

// ── Bulk tag ──────────────────────────────────────────────────────────────────

async function bulkTag() {
  const tag = prompt('Tag to add to selected files:'); if (!tag || !tag.trim()) return;
  const t = tag.trim();
  for (const key of selectedFiles) {
    const fm = meta.files[key] || {}; const tags = fm.tags || [];
    if (!tags.includes(t)) tags.push(t);
    meta.files[key] = { ...fm, tags };
  }
  selectedFiles.clear(); await saveMeta(); renderFileList();
}

// ── Folder management ─────────────────────────────────────────────────────────

async function addFolder() {
  const name = prompt('Folder name:'); if (!name) return;
  const safe = name.replace(/[^a-zA-Z0-9_\- ]/g, '').trim();
  if (!safe || (meta.folders || []).includes(safe)) return;
  meta.folders.push(safe); await saveMeta(); renderFileList();
}

async function renameFolder(oldName) {
  const newName = prompt('New folder name:', oldName); if (!newName || newName === oldName) return;
  const safe = newName.replace(/[^a-zA-Z0-9_\- ]/g, '').trim();
  if (!safe || (meta.folders || []).includes(safe)) { alert('Invalid or duplicate name.'); return; }
  const toMove = allFiles.filter(f => f.key.startsWith(oldName + '/'));
  for (const f of toMove) {
    try {
      const r = await api('/memos/' + memoId + '/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ srcKey: f.key, dstFolder: safe }) });
      const { key: newKey } = await r.json();
      if (meta.files[f.key]) { meta.files[newKey] = meta.files[f.key]; delete meta.files[f.key]; }
    } catch {}
  }
  meta.folders = meta.folders.map(f => f === oldName ? safe : f);
  if (currentFolder === oldName) currentFolder = safe;
  await saveMeta(); await loadFiles();
}

async function removeFolder(name) {
  if (!confirm(`Remove folder "${name}"? Files inside will be moved to root.`)) return;
  const toMove = allFiles.filter(f => f.key.startsWith(name + '/'));
  for (const f of toMove) {
    try {
      const r = await api('/memos/' + memoId + '/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ srcKey: f.key, dstFolder: '' }) });
      const { key: newKey } = await r.json();
      if (meta.files[f.key]) { meta.files[newKey] = meta.files[f.key]; delete meta.files[f.key]; }
    } catch {}
  }
  meta.folders = meta.folders.filter(f => f !== name);
  if (currentFolder === name) currentFolder = '';
  await saveMeta(); await loadFiles();
}

// ── Lightbox ──────────────────────────────────────────────────────────────────

function openLightbox(key) {
  const previewable = allFiles.filter(f => isPreviewable(f.key) && !f.key.startsWith('_'));
  lbFiles = previewable.length ? previewable : [{ key }];
  lbIdx = lbFiles.findIndex(f => f.key === key);
  if (lbIdx === -1) lbIdx = 0;
  showLightbox();
}
function showLightbox() {
  const f = lbFiles[lbIdx]; if (!f) return;
  document.getElementById('lightbox').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  const c = document.getElementById('lb-content');
  c.innerHTML = isPdf(f.key) ? `<iframe src="${fileUrl(f.key)}"></iframe>` : `<img src="${fileUrl(f.key)}" alt="${esc(basename(f.key))}">`;
  document.getElementById('lb-caption').textContent = basename(f.key);
  document.getElementById('lb-counter').textContent = lbFiles.length > 1 ? `${lbIdx + 1} / ${lbFiles.length}` : '';
  const multi = lbFiles.length > 1;
  document.getElementById('lb-prev').style.display = multi ? '' : 'none';
  document.getElementById('lb-next').style.display = multi ? '' : 'none';
}
function closeLightbox() { document.getElementById('lightbox').classList.add('hidden'); document.getElementById('lb-content').innerHTML = ''; document.body.style.overflow = ''; }
function lbNav(dir) { lbIdx = (lbIdx + dir + lbFiles.length) % lbFiles.length; showLightbox(); }
document.getElementById('lightbox').addEventListener('click', e => { if (e.target === document.getElementById('lightbox')) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').classList.contains('hidden')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});
function downloadFile(key) { const a = document.createElement('a'); a.href = fileUrl(key); a.download = basename(key); a.click(); }

// ── File info modal ───────────────────────────────────────────────────────────

function openFileInfo(key) {
  modalFile = key;
  const fm = meta.files[key] || {};
  document.getElementById('modal-caption').value = fm.caption || '';
  document.getElementById('modal-tags').value = (fm.tags || []).join(', ');
  document.getElementById('info-modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('info-modal').classList.add('hidden'); modalFile = null; }
async function saveFileInfo() {
  if (!modalFile) return;
  meta.files[modalFile] = {
    caption: document.getElementById('modal-caption').value.trim(),
    tags: document.getElementById('modal-tags').value.split(',').map(t => t.trim()).filter(Boolean),
  };
  await saveMeta(); closeModal(); renderFileList();
}

// ── Notes ─────────────────────────────────────────────────────────────────────

function exec(cmd) { document.getElementById('note-editor').focus(); document.execCommand(cmd, false, null); }
function clearNote() { if (!confirm('Clear the note?')) return; document.getElementById('note-editor').innerHTML = ''; document.getElementById('note-status').textContent = 'Cleared'; }

function showBlockStyleMenu(e) {
  showFloatMenu(e, [
    { label: 'Heading',    fn: `applyBlockStyle('h2')` },
    { label: 'Subheading', fn: `applyBlockStyle('h3')` },
    { label: 'Body',       fn: `applyBlockStyle('p')` },
  ]);
}
function applyBlockStyle(tag) {
  document.getElementById('note-editor').focus();
  document.execCommand('formatBlock', false, tag);
}

function changeFontSize(delta) {
  document.getElementById('note-editor').focus();
  const cur = parseInt(document.queryCommandValue('fontSize')) || 3;
  document.execCommand('fontSize', false, String(Math.max(1, Math.min(7, cur + delta))));
}

// Text color
let _savedRange = null;
document.getElementById('text-color-input').addEventListener('mousedown', () => {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) _savedRange = sel.getRangeAt(0).cloneRange();
});
document.getElementById('text-color-input').addEventListener('input', e => applyTextColor(e.target.value));
function applyTextColor(color) {
  const editor = document.getElementById('note-editor');
  editor.focus();
  if (_savedRange) { const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(_savedRange); }
  document.execCommand('foreColor', false, color);
  document.getElementById('color-preview').style.color = color;
}

// Highlight
function showHighlightMenu(e) {
  showFloatMenu(e, [
    { label: '🟡 Yellow', fn: `applyHighlight('#fef08a')` },
    { label: '🟢 Green',  fn: `applyHighlight('#bbf7d0')` },
    { label: '🩷 Pink',   fn: `applyHighlight('#fecdd3')` },
    { label: '🔵 Blue',   fn: `applyHighlight('#bfdbfe')` },
    '---',
    { label: '✕ Remove',  fn: `applyHighlight('transparent')` },
  ]);
}
function applyHighlight(color) {
  document.getElementById('note-editor').focus();
  if (!document.execCommand('hiliteColor', false, color)) document.execCommand('backColor', false, color);
}

// Note auto-save (2 s debounce after last change; immediate on blur)
let _noteTimer = null;
document.getElementById('note-editor').addEventListener('input', () => {
  document.getElementById('note-status').textContent = 'Unsaved…';
  clearTimeout(_noteTimer);
  _noteTimer = setTimeout(saveNote, 2000);
});
document.getElementById('note-editor').addEventListener('blur', () => {
  clearTimeout(_noteTimer);
  saveNote();
});

// Keyboard shortcuts for font size (⌘= bigger, ⌘- smaller)
document.addEventListener('keydown', e => {
  if (document.activeElement !== document.getElementById('note-editor')) return;
  if ((e.metaKey || e.ctrlKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); changeFontSize(1); }
  if ((e.metaKey || e.ctrlKey) && e.key === '-') { e.preventDefault(); changeFontSize(-1); }
});

// Paste image from clipboard
document.getElementById('note-editor').addEventListener('paste', e => {
  const items = Array.from(e.clipboardData.items);
  const imgItem = items.find(i => i.type.startsWith('image/'));
  if (!imgItem) return;
  e.preventDefault();
  const file = imgItem.getAsFile();
  const reader = new FileReader();
  reader.onload = ev => {
    document.execCommand('insertHTML', false,
      `<img src="${ev.target.result}" data-paste-img="1" style="max-width:100%;height:auto">`
    );
    saveNote();
  };
  reader.readAsDataURL(file);
});

// Click pasted image → size picker
document.getElementById('note-editor').addEventListener('click', e => {
  if (e.target.tagName === 'IMG' && e.target.dataset.pasteImg) {
    e.stopPropagation();
    window._noteImg = e.target;
    showFloatMenuAt(e.target.getBoundingClientRect(), [
      { label: 'Small  (200 px)', fn: `setNoteImgSize('small')` },
      { label: 'Best fit  (100%)', fn: `setNoteImgSize('fit')` },
      { label: 'Original size', fn: `setNoteImgSize('original')` },
    ]);
  }
});

function showFloatMenuAt(rect, items) {
  const menu = document.getElementById('float-menu');
  menu.innerHTML = items.map(item =>
    `<button onclick="${item.fn}">${esc(item.label)}</button>`
  ).join('');
  menu.style.display = 'block';
  let left = rect.left, top = rect.bottom + 4;
  if (left + 170 > window.innerWidth) left = window.innerWidth - 175;
  if (top + items.length * 40 > window.innerHeight) top = rect.top - items.length * 40 - 4;
  menu.style.left = left + 'px'; menu.style.top = top + 'px';
}

function setNoteImgSize(mode) {
  const img = window._noteImg; if (!img) return;
  if (mode === 'small')    { img.style.width = '200px'; img.style.maxWidth = '200px'; img.style.height = 'auto'; }
  else if (mode === 'fit') { img.style.width = '';       img.style.maxWidth = '100%'; img.style.height = 'auto'; }
  else                     { img.style.width = 'auto';   img.style.maxWidth = 'none'; img.style.height = 'auto'; }
  saveNote();
}

async function saveNote() {
  const html = document.getElementById('note-editor').innerHTML;
  document.getElementById('note-status').textContent = 'Saving…';
  try { await api('/memos/' + memoId + '/note', { method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: html }); document.getElementById('note-status').textContent = 'Saved ✓'; }
  catch { document.getElementById('note-status').textContent = 'Error'; }
}

async function saveInfo() {

  if (st) st.textContent = 'Saving…';
  try {
    await api('/memos/' + memoId, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: document.getElementById('title-input').value.trim(), description: document.getElementById('desc-input').value.trim(),
        uid: document.getElementById('uid-input').value.trim(), cover_file: document.getElementById('cover-select').value,
        tags: getTagsFromUI(), links: getLinksFromUI(), pinned: memo ? memo.pinned : 0 }) });

  } catch { if (st) st.textContent = 'Error'; }
}
document.getElementById('title-input').addEventListener('change', saveInfo);
document.getElementById('desc-input').addEventListener('change', saveInfo);

// Auto-save links on input (2 s debounce) + live ↗ button
let _infoTimer = null;
document.getElementById('links-list').addEventListener('input', e => {
  if (e.target.dataset.type === 'url') {
    const row = e.target.closest('.link-row');
    let btn = row.querySelector('.link-open-btn');
    const url = e.target.value.trim();
    if (url && !btn) {
      btn = document.createElement('a');
      btn.className = 'link-open-btn'; btn.target = '_blank'; btn.rel = 'noopener'; btn.title = 'Open link'; btn.textContent = '↗';
      e.target.insertAdjacentElement('afterend', btn);
    }
    if (btn) { btn.href = /^https?:\/\//i.test(url) ? url : 'https://' + url; btn.style.display = url ? '' : 'none'; }
  }
  const st = document.getElementById('info-status');
  if (st) st.textContent = 'Unsaved…';
  clearTimeout(_infoTimer);
  _infoTimer = setTimeout(saveInfo, 2000);
});

// ── Tags ──────────────────────────────────────────────────────────────────────

function renderTags(tags) {
  currentTags = [...tags];
  const wrap = document.getElementById('tag-wrap');
  wrap.querySelectorAll('.tag-chip').forEach(c => c.remove());
  currentTags.forEach(t => {
    const chip = document.createElement('span'); chip.className = 'tag-chip';
    chip.innerHTML = `${esc(t)}<button onclick="removeTag('${esc(t)}')" title="Remove">×</button>`;
    wrap.insertBefore(chip, document.getElementById('tag-text-input'));
  });
}
function removeTag(t) { renderTags(currentTags.filter(x => x !== t)); }
function getTagsFromUI() { return [...currentTags]; }
document.getElementById('tag-text-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault(); const val = e.target.value.trim().replace(/,$/, '');
    if (val && !currentTags.includes(val)) { currentTags.push(val); renderTags(currentTags); }
    e.target.value = '';
  }
});

// ── Links ─────────────────────────────────────────────────────────────────────

function renderLinks(links) {
  const list = document.getElementById('links-list'); list.innerHTML = '';
  links.forEach((l, i) => {
    const row = document.createElement('div'); row.className = 'link-row';
    row.innerHTML = `<input type="text" placeholder="Label" value="${esc(l.label)}" data-idx="${i}" data-type="label">
      <input type="url" placeholder="URL" value="${esc(l.url)}" data-idx="${i}" data-type="url">
      ${l.url ? `<a class="link-open-btn" href="${/^https?:\/\//i.test(l.url) ? esc(l.url) : 'https://' + esc(l.url)}" target="_blank" rel="noopener" title="Open link">↗</a>` : ''}
      <button onclick="removeLink(${i})">✕</button>`;
    list.appendChild(row);
  });
}
function addLink() { renderLinks([...getLinksFromUI(), { label: '', url: '' }]); }
function removeLink(i) { const l = getLinksFromUI(); l.splice(i, 1); renderLinks(l); }
function getLinksFromUI() {
  return Array.from(document.querySelectorAll('.link-row')).map(row => ({
    label: (row.querySelector('[data-type="label"]') || {}).value || '',
    url: (row.querySelector('[data-type="url"]') || {}).value || '',
  })).filter(l => l.url);
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function safeJson(s, fb) { try { return typeof s === 'string' ? JSON.parse(s) : (s || fb); } catch { return fb; } }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
function fmtSize(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; }
function fileIcon(name) {
  const e = ext(name);
  if (isPdf(name)) return '📄';
  if (['mp4','mov','avi','mkv','webm'].includes(e)) return '🎬';
  if (['mp3','wav','aac','flac'].includes(e)) return '🎵';
  if (['zip','tar','gz','rar'].includes(e)) return '📦';
  if (['doc','docx'].includes(e)) return '📝';
  if (['xls','xlsx','csv'].includes(e)) return '📊';
  return '📄';
}

// ── Hover image preview ───────────────────────────────────────────────────────

const hoverBox = document.getElementById('hover-preview');
const hoverImg = hoverBox.querySelector('img');

function positionHover(e) {
  const w = 260, h = 260, pad = 16;
  let left = e.clientX + pad;
  let top = e.clientY - h / 2;
  if (left + w > window.innerWidth) left = e.clientX - w - pad;
  top = Math.max(pad, Math.min(top, window.innerHeight - h - pad));
  hoverBox.style.left = left + 'px';
  hoverBox.style.top = top + 'px';
}

document.addEventListener('mouseover', e => {
  if (e.target.dataset && e.target.dataset.preview && e.target.src) {
    hoverImg.src = e.target.src;
    hoverBox.style.display = 'block';
    positionHover(e);
  }
});
document.addEventListener('mouseout', e => {
  if (e.target.dataset && e.target.dataset.preview) {
    hoverBox.style.display = 'none';
    hoverImg.src = '';
  }
});
document.addEventListener('mousemove', e => {
  if (hoverBox.style.display !== 'none') positionHover(e);
});

// ── Clips / Snippets ──────────────────────────────────────────────────────────
let snippets = [];

async function loadSnippets() {
  try { snippets = await (await api('/memos/' + memoId + '/snippets')).json(); }
  catch { snippets = []; }
  renderSnippets();
}

async function saveSnippets() {
  try {
    await api('/memos/' + memoId + '/snippets', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(snippets),
    });
  } catch {}
}

function showClipPanel() {
  const panel = document.getElementById('clip-panel');
  panel.style.display = '';
  document.getElementById('clip-title-input').value = '';
  document.getElementById('clip-paste-area').innerHTML = '';
  document.getElementById('clip-title-input').focus();
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function cancelClip() {
  document.getElementById('clip-panel').style.display = 'none';
}

async function saveClip() {
  const title = document.getElementById('clip-title-input').value.trim() || 'Untitled clip';
  const content = document.getElementById('clip-paste-area').innerHTML;
  if (!document.getElementById('clip-paste-area').innerText.trim()) {
    document.getElementById('clip-paste-area').focus();
    return;
  }
  snippets.push({ id: crypto.randomUUID(), title, content, created_at: new Date().toISOString() });
  await saveSnippets();
  renderSnippets();
  cancelClip();
}

function renderSnippets() {
  const area = document.getElementById('snippets-area');
  if (!snippets.length) { area.innerHTML = ''; return; }
  area.innerHTML = snippets.map((s, i) => `
    <div class="snippet-card">
      <div class="snippet-hdr" onclick="toggleSnippet(${i})">
        <span class="snippet-icon">📋</span>
        <span class="snippet-name" contenteditable="true" spellcheck="false" data-i="${i}" onclick="event.stopPropagation()" onblur="renameClip(this)">${esc(s.title)}</span>
        <span class="snippet-ts">${new Date(s.created_at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
        <button class="snippet-del" onclick="deleteSnippet(${i},event)" title="Delete clip">✕</button>
        <span class="snippet-chev" id="chev-${i}">▸</span>
      </div>
      <div class="snippet-body" id="sb-${i}" style="display:none">
        <div class="snippet-content">${s.content}</div>
        <div class="snippet-foot">
          <button onclick="copyClipText(${i})">Copy text</button>
        </div>
      </div>
    </div>`).join('');
}

function toggleSnippet(i) {
  const body = document.getElementById('sb-' + i);
  const chev = document.getElementById('chev-' + i);
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  chev.classList.toggle('open', !open);
}

async function deleteSnippet(i, e) {
  e.stopPropagation();
  if (!confirm('Delete this clip?')) return;
  snippets.splice(i, 1);
  await saveSnippets();
  renderSnippets();
}

async function renameClip(el) {
  const i = parseInt(el.dataset.i);
  const title = el.innerText.trim();
  if (!title) { el.innerText = snippets[i].title; return; }
  if (title === snippets[i].title) return;
  snippets[i].title = title;
  await saveSnippets();
}

async function copyClipText(i) {
  const s = snippets[i];
  if (!s) return;
  const text = new DOMParser().parseFromString(s.content, 'text/html').body.innerText;
  try { await navigator.clipboard.writeText(text); } catch {}
}

// ── Global search ─────────────────────────────────────────────────────────────
let _gs_timer = null, _gs_results = [], _gs_idx = -1;
const gsInput = document.getElementById('gsearch');
const gsDrop  = document.getElementById('gsearch-drop');

gsInput.addEventListener('input', () => {
  clearTimeout(_gs_timer);
  const q = gsInput.value.trim();
  if (!q) { gsDrop.classList.remove('open'); _gs_idx = -1; return; }
  _gs_timer = setTimeout(() => doGSearch(q), 300);
});

gsInput.addEventListener('keydown', e => {
  if (!gsDrop.classList.contains('open')) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); gsSetIdx(_gs_idx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); gsSetIdx(_gs_idx - 1); }
  else if (e.key === 'Enter' && _gs_idx >= 0) { e.preventDefault(); gsGo(_gs_results[_gs_idx]); }
  else if (e.key === 'Escape') { gsDrop.classList.remove('open'); gsInput.blur(); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.gsearch-wrap')) { gsDrop.classList.remove('open'); _gs_idx = -1; }
});

async function doGSearch(q) {
  try { _gs_results = await (await api('/search?q=' + encodeURIComponent(q))).json(); }
  catch { _gs_results = []; }
  _gs_idx = -1;
  if (!_gs_results.length) {
    gsDrop.innerHTML = '<div class="gsr-item" style="color:var(--muted);cursor:default">No results</div>';
  } else {
    gsDrop.innerHTML = _gs_results.slice(0, 8).map((r, i) => `
      <div class="gsr-item" onclick="gsGo(_gs_results[${i}])">
        <div class="gsr-title">${esc(r.title || 'Untitled')}</div>
        <div class="gsr-meta">${esc(r.memo_id)}${r.uid ? ' · ' + esc(r.uid) : ''}</div>
        ${r.description ? `<div class="gsr-desc">${esc(r.description)}</div>` : ''}
      </div>`).join('');
  }
  gsDrop.classList.add('open');
}

function gsSetIdx(i) {
  const items = gsDrop.querySelectorAll('.gsr-item');
  _gs_idx = Math.max(-1, Math.min(i, items.length - 1));
  items.forEach((el, j) => el.classList.toggle('hi', j === _gs_idx));
  if (_gs_idx >= 0) items[_gs_idx].scrollIntoView({ block: 'nearest' });
}

function gsGo(r) { window.location.href = '/memo/?id=' + encodeURIComponent(r.id); }

init();
</script>

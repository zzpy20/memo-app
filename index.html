<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Memo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#F7F7F5; --surface:#FFFFFF; --surface-2:#F0EFEB;
      --border:rgba(0,0,0,0.07); --border-strong:rgba(0,0,0,0.13);
      --text:#0F0F0E; --muted:#787873; --accent:#0F0F0E; --accent-fg:#FFFFFF;
      --danger:#A32D2D; --danger-bg:#FCEBEB; --danger-border:#F7C1C1;
      --tag-bg:#EFEFEB; --tag-text:#3C3C38;
      --radius:12px; --radius-sm:8px;
      --font:'DM Sans',-apple-system,sans-serif; --mono:'DM Mono',monospace;
      --sidebar:300px;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#111110; --surface:#1C1C1A; --surface-2:#242422;
      --border:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.13);
      --text:#F0EFEB; --muted:#88887F; --accent:#F0EFEB; --accent-fg:#111110;
      --danger:#F7C1C1; --danger-bg:#501313; --danger-border:#A32D2D;
      --tag-bg:#2A2A27; --tag-text:#B8B8B0;
    }}

    html, body { height: 100%; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

    /* ── Top bar ──────────────────────────────────────────────────────────── */
    .topbar { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
    .topbar-title { font-size:15px; font-weight:600; letter-spacing:-0.2px; flex-shrink:0; }
    .search-wrap { flex:1; position:relative; }
    .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; pointer-events:none; }
    .search-input { font-family:var(--font); font-size:13px; width:100%; padding:7px 10px 7px 30px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-2); color:var(--text); outline:none; }
    .search-input:focus { border-color:var(--border-strong); }
    .search-input::placeholder { color:var(--muted); }
    .btn { font-family:var(--font); font-size:13px; font-weight:500; padding:7px 14px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface); color:var(--text); cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; transition:opacity .15s; }
    .btn:hover { opacity:.7; }
    .btn.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
    .btn.danger { background:var(--danger-bg); color:var(--danger); border-color:var(--danger-border); }
    .btn.sm { padding:5px 10px; font-size:12px; }
    .btn.ghost { border-color:transparent; background:transparent; }
    .btn.active { background:var(--surface-2); border-color:var(--border-strong); }
    .btn:disabled { opacity:.4; cursor:not-allowed; }

    /* ── Auth ─────────────────────────────────────────────────────────────── */
    .auth-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:9999; }
    .auth-box { background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius); padding:32px; width:min(360px,90vw); }
    .auth-title { font-size:18px; font-weight:600; margin-bottom:4px; }
    .auth-sub { font-size:13px; color:var(--muted); margin-bottom:20px; }
    .auth-input { font-family:var(--font); font-size:14px; width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--bg); color:var(--text); outline:none; margin-bottom:12px; }
    .auth-input:focus { border-color:var(--text); }
    .auth-err { font-size:12px; color:var(--danger); font-family:var(--mono); margin-top:8px; min-height:16px; }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    .app { display:flex; flex:1; overflow:hidden; }
    .sidebar { width:var(--sidebar); flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid var(--border); background:var(--surface); overflow:hidden; }
    .editor-pane { flex:1; display:flex; flex-direction:column; overflow:hidden; }

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .sidebar-tags { display:flex; gap:5px; flex-wrap:wrap; padding:10px 12px 0; }
    .tag-pill { font-size:11px; font-weight:500; padding:3px 9px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--muted); cursor:pointer; font-family:var(--font); transition:all .15s; }
    .tag-pill:hover, .tag-pill.active { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
    .memo-list { flex:1; overflow-y:auto; padding:8px 0; }
    .memo-item { padding:10px 14px; cursor:pointer; border-left:2px solid transparent; transition:background .1s; }
    .memo-item:hover { background:var(--surface-2); }
    .memo-item.active { background:var(--surface-2); border-left-color:var(--accent); }
    .memo-item-title { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:2px; }
    .memo-item-title.untitled { color:var(--muted); font-weight:400; font-style:italic; }
    .memo-item-meta { font-size:11px; color:var(--muted); font-family:var(--mono); margin-bottom:4px; }
    .memo-item-tags { display:flex; gap:4px; flex-wrap:wrap; }
    .memo-item-tag { font-size:10px; padding:1px 6px; border-radius:999px; background:var(--tag-bg); color:var(--tag-text); }
    .memo-item-snippet { font-size:11px; color:var(--muted); margin-top:3px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .memo-item-snippet mark { background:transparent; color:var(--accent); font-weight:600; }
    .pin-icon { font-size:10px; margin-right:3px; }
    .empty-list { padding:24px 14px; text-align:center; color:var(--muted); font-size:13px; }

    /* ── Editor ───────────────────────────────────────────────────────────── */
    .editor-toolbar { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .save-status { font-size:11px; color:var(--muted); font-family:var(--mono); margin-left:auto; }
    .save-status.saving { color:var(--muted); }
    .save-status.saved { color:#3B6D11; }
    .save-status.error { color:var(--danger); }
    .editor-body { flex:1; display:flex; flex-direction:column; overflow:hidden; padding:20px 24px; gap:12px; }
    .title-input { font-family:var(--font); font-size:22px; font-weight:600; border:none; background:transparent; color:var(--text); outline:none; width:100%; letter-spacing:-0.3px; }
    .title-input::placeholder { color:var(--muted); }
    .editor-area { flex:1; position:relative; overflow:hidden; }
    .body-textarea { font-family:var(--mono); font-size:13px; line-height:1.7; width:100%; height:100%; border:none; background:transparent; color:var(--text); outline:none; resize:none; }
    .body-textarea::placeholder { color:var(--muted); }
    .preview-content { font-size:14px; line-height:1.75; overflow-y:auto; height:100%; color:var(--text); }
    .preview-content h1,.preview-content h2,.preview-content h3 { font-weight:600; margin:1.2em 0 0.5em; letter-spacing:-0.2px; }
    .preview-content h1 { font-size:1.5em; }
    .preview-content h2 { font-size:1.25em; }
    .preview-content h3 { font-size:1.1em; }
    .preview-content p { margin-bottom:0.9em; }
    .preview-content ul,.preview-content ol { padding-left:1.5em; margin-bottom:0.9em; }
    .preview-content li { margin-bottom:0.3em; }
    .preview-content code { font-family:var(--mono); font-size:0.9em; background:var(--surface-2); padding:1px 5px; border-radius:4px; }
    .preview-content pre { background:var(--surface-2); padding:12px; border-radius:var(--radius-sm); overflow-x:auto; margin-bottom:0.9em; }
    .preview-content pre code { background:none; padding:0; }
    .preview-content blockquote { border-left:3px solid var(--border-strong); padding-left:12px; color:var(--muted); margin-bottom:0.9em; }
    .preview-content a { color:var(--accent); }
    .preview-content hr { border:none; border-top:1px solid var(--border); margin:1.2em 0; }
    .preview-content table { border-collapse:collapse; width:100%; margin-bottom:0.9em; }
    .preview-content th,.preview-content td { border:1px solid var(--border-strong); padding:6px 10px; font-size:13px; }
    .preview-content th { background:var(--surface-2); font-weight:600; }
    .editor-footer { display:flex; align-items:center; gap:8px; flex-shrink:0; padding-top:4px; border-top:1px solid var(--border); flex-wrap:wrap; }
    .tags-input { font-family:var(--mono); font-size:12px; flex:1; border:none; background:transparent; color:var(--text); outline:none; min-width:120px; }
    .tags-input::placeholder { color:var(--muted); }
    .tags-label { font-size:11px; color:var(--muted); flex-shrink:0; }

    /* ── Empty state ──────────────────────────────────────────────────────── */
    .no-memo { flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; }

    /* ── Mobile ───────────────────────────────────────────────────────────── */
    @media(max-width:640px){
      :root { --sidebar:100%; }
      .app { position:relative; }
      .sidebar { position:absolute; inset:0; z-index:10; transform:translateX(0); transition:transform .2s; }
      .sidebar.hidden { transform:translateX(-100%); }
      .editor-pane { position:absolute; inset:0; }
      .back-btn { display:flex !important; }
    }
    .back-btn { display:none; }
  </style>
</head>
<body>

<!-- Auth overlay -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <div class="auth-title">Memo</div>
    <div class="auth-sub">Enter your passphrase to continue</div>
    <input class="auth-input" type="password" id="passphraseInput" placeholder="Passphrase…" autocomplete="current-password" />
    <button class="btn primary" id="unlockBtn" style="width:100%">Unlock</button>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-title">📝 Memo</div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="searchInput" type="search" placeholder="Search memos…" autocomplete="off" />
  </div>
  <button class="btn primary" id="newMemoBtn">+ New</button>
</div>

<!-- App -->
<div class="app" id="app" style="display:none">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-tags" id="tagFilters"></div>
    <div class="memo-list" id="memoList"></div>
  </div>

  <!-- Editor -->
  <div class="editor-pane" id="editorPane">
    <div class="editor-toolbar">
      <button class="btn sm ghost back-btn" id="backBtn">← Back</button>
      <button class="btn sm ghost" id="togglePreviewBtn">Preview</button>
      <button class="btn sm ghost" id="pinBtn">📌 Pin</button>
      <button class="btn sm danger" id="deleteBtn">Delete</button>
      <span class="save-status" id="saveStatus"></span>
    </div>
    <div id="noMemoState" class="no-memo">Select a memo or create a new one</div>
    <div id="editorContent" style="display:none;flex:1;flex-direction:column;overflow:hidden;padding:20px 24px;gap:12px;display:none">
      <input class="title-input" id="titleInput" type="text" placeholder="Untitled" />
      <div class="editor-area" id="editorArea">
        <textarea class="body-textarea" id="bodyTextarea" placeholder="Write your memo in markdown…"></textarea>
        <div class="preview-content" id="previewContent" style="display:none"></div>
      </div>
      <div class="editor-footer">
        <span class="tags-label">Tags:</span>
        <input class="tags-input" id="tagsInput" type="text" placeholder="tag1, tag2, tag3" />
      </div>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://memo-worker.ausz.workers.dev';
const TOKEN_KEY = 'memo_auth_token';

// ── State ──────────────────────────────────────────────────────────────────
let TOKEN = '';
let allMemos = [];
let currentId = null;
let saveTimer = null;
let isPreview = false;
let activeTag = null;
let isSearchMode = false;

// ── Auth ───────────────────────────────────────────────────────────────────
function getTok() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; } }
function setTok(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch {} }
function clearTok() { try { localStorage.removeItem(TOKEN_KEY); } catch {} }

function api(path, opts = {}) {
  const url = new URL(WORKER + path);
  url.searchParams.set('t', TOKEN);
  return fetch(url.toString(), opts);
}

async function checkAuth(tok) {
  const url = new URL(WORKER + '/');
  url.searchParams.set('t', tok);
  url.searchParams.set('check', '1');
  const res = await fetch(url.toString());
  return res.ok;
}

document.getElementById('unlockBtn').addEventListener('click', async () => {
  const tok = document.getElementById('passphraseInput').value.trim();
  if (!tok) return;
  const err = document.getElementById('authErr');
  err.textContent = 'Checking…';
  try {
    const ok = await checkAuth(tok);
    if (ok) {
      TOKEN = tok; setTok(tok);
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      await bootstrap();
    } else {
      err.textContent = 'Incorrect passphrase.';
    }
  } catch { err.textContent = 'Connection error.'; }
});
document.getElementById('passphraseInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});

// ── Bootstrap ──────────────────────────────────────────────────────────────
async function bootstrap() {
  await Promise.all([loadMemos(), loadTags()]);
  renderList(allMemos);
}

async function loadMemos(tag) {
  const path = tag ? `/memos?tag=${encodeURIComponent(tag)}` : '/memos';
  const res = await api(path);
  allMemos = res.ok ? await res.json() : [];
}

async function loadTags() {
  const res = await api('/tags');
  const tags = res.ok ? await res.json() : [];
  renderTagFilters(tags);
}

// ── Tag filters ────────────────────────────────────────────────────────────
function renderTagFilters(tags) {
  const wrap = document.getElementById('tagFilters');
  wrap.innerHTML = '';
  if (!tags.length) return;
  const all = document.createElement('button');
  all.className = 'tag-pill' + (!activeTag ? ' active' : '');
  all.textContent = 'All';
  all.onclick = () => { activeTag = null; filterByTag(null); };
  wrap.appendChild(all);
  tags.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tag-pill' + (activeTag === t ? ' active' : '');
    b.textContent = t;
    b.onclick = () => filterByTag(t);
    wrap.appendChild(b);
  });
}

async function filterByTag(tag) {
  activeTag = tag;
  document.querySelectorAll('.tag-pill').forEach(p => {
    p.classList.toggle('active', (tag ? p.textContent === tag : p.textContent === 'All'));
  });
  await loadMemos(tag);
  renderList(allMemos);
}

// ── List ───────────────────────────────────────────────────────────────────
function relTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  if (d < 30) return d + 'd ago';
  return new Date(iso).toLocaleDateString();
}

function renderList(memos, searchResults = false) {
  const list = document.getElementById('memoList');
  list.innerHTML = '';
  if (!memos.length) {
    list.innerHTML = '<div class="empty-list">' + (searchResults ? 'No results' : 'No memos yet') + '</div>';
    return;
  }
  memos.forEach(m => {
    const div = document.createElement('div');
    div.className = 'memo-item' + (m.id === currentId ? ' active' : '');
    div.dataset.id = m.id;

    const title = document.createElement('div');
    title.className = 'memo-item-title' + (m.title ? '' : ' untitled');
    if (m.pinned) { const pin = document.createElement('span'); pin.className = 'pin-icon'; pin.textContent = '📌'; title.appendChild(pin); }
    title.appendChild(document.createTextNode(m.title || 'Untitled'));

    const meta = document.createElement('div');
    meta.className = 'memo-item-meta';
    meta.textContent = relTime(m.updated_at);

    div.appendChild(title);
    div.appendChild(meta);

    let tags = [];
    try { tags = JSON.parse(m.tags || '[]'); } catch {}
    if (tags.length) {
      const tw = document.createElement('div');
      tw.className = 'memo-item-tags';
      tags.slice(0, 3).forEach(t => {
        const s = document.createElement('span');
        s.className = 'memo-item-tag';
        s.textContent = t;
        tw.appendChild(s);
      });
      div.appendChild(tw);
    }

    if (m.snippet) {
      const sn = document.createElement('div');
      sn.className = 'memo-item-snippet';
      sn.innerHTML = m.snippet;
      div.appendChild(sn);
    }

    div.addEventListener('click', () => openMemo(m.id));
    list.appendChild(div);
  });
}

// ── Open / load memo ───────────────────────────────────────────────────────
async function openMemo(id) {
  if (currentId === id) return;
  flushSave();
  currentId = id;
  document.querySelectorAll('.memo-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));

  const res = await api('/memos/' + id);
  if (!res.ok) return;
  const memo = await res.json();

  document.getElementById('titleInput').value = memo.title || '';
  document.getElementById('bodyTextarea').value = memo.body || '';
  let tags = [];
  try { tags = JSON.parse(memo.tags || '[]'); } catch {}
  document.getElementById('tagsInput').value = tags.join(', ');
  updatePinBtn(!!memo.pinned);
  showEditor(true);
  setPreviewMode(false);
  setSaveStatus('');

  // Mobile: hide sidebar
  document.getElementById('sidebar').classList.add('hidden');
}

function showEditor(show) {
  document.getElementById('noMemoState').style.display = show ? 'none' : 'flex';
  const ec = document.getElementById('editorContent');
  ec.style.display = show ? 'flex' : 'none';
  ec.style.flexDirection = 'column';
}

function updatePinBtn(pinned) {
  document.getElementById('pinBtn').classList.toggle('active', pinned);
}

// ── New memo ───────────────────────────────────────────────────────────────
document.getElementById('newMemoBtn').addEventListener('click', async () => {
  flushSave();
  const res = await api('/memos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: '', body: '', tags: [], pinned: false }),
  });
  if (!res.ok) return;
  const { id } = await res.json();
  await loadMemos(activeTag);
  renderList(allMemos);
  await openMemo(id);
  document.getElementById('titleInput').focus();
});

// ── Save ───────────────────────────────────────────────────────────────────
function setSaveStatus(msg, cls = '') {
  const el = document.getElementById('saveStatus');
  el.textContent = msg;
  el.className = 'save-status' + (cls ? ' ' + cls : '');
}

function scheduleSave() {
  clearTimeout(saveTimer);
  setSaveStatus('Unsaved', '');
  saveTimer = setTimeout(saveCurrent, 1500);
}

async function saveCurrent() {
  if (!currentId) return;
  setSaveStatus('Saving…', 'saving');
  const title = document.getElementById('titleInput').value;
  const body = document.getElementById('bodyTextarea').value;
  const rawTags = document.getElementById('tagsInput').value;
  const tags = rawTags.split(',').map(t => t.trim()).filter(Boolean);
  const pinned = document.getElementById('pinBtn').classList.contains('active');
  try {
    const res = await api('/memos/' + currentId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body, tags, pinned }),
    });
    if (res.ok) {
      setSaveStatus('Saved ✓', 'saved');
      // Update list item in place
      const item = document.querySelector(`.memo-item[data-id="${currentId}"]`);
      if (item) {
        const t = item.querySelector('.memo-item-title');
        if (t) { t.innerHTML = ''; if (pinned) { const p = document.createElement('span'); p.className = 'pin-icon'; p.textContent = '📌'; t.appendChild(p); } t.appendChild(document.createTextNode(title || 'Untitled')); t.className = 'memo-item-title' + (title ? '' : ' untitled'); }
        const meta = item.querySelector('.memo-item-meta');
        if (meta) meta.textContent = 'just now';
      }
    } else {
      setSaveStatus('Error saving', 'error');
    }
  } catch { setSaveStatus('Error saving', 'error'); }
}

function flushSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saveCurrent(); }
}

document.getElementById('titleInput').addEventListener('input', scheduleSave);
document.getElementById('bodyTextarea').addEventListener('input', scheduleSave);
document.getElementById('tagsInput').addEventListener('input', scheduleSave);

// ── Preview ────────────────────────────────────────────────────────────────
function setPreviewMode(on) {
  isPreview = on;
  const ta = document.getElementById('bodyTextarea');
  const pv = document.getElementById('previewContent');
  const btn = document.getElementById('togglePreviewBtn');
  if (on) {
    pv.innerHTML = marked.parse(ta.value || '');
    ta.style.display = 'none';
    pv.style.display = 'block';
    btn.textContent = 'Edit';
    btn.classList.add('active');
  } else {
    ta.style.display = 'block';
    pv.style.display = 'none';
    btn.textContent = 'Preview';
    btn.classList.remove('active');
  }
}

document.getElementById('togglePreviewBtn').addEventListener('click', () => {
  if (!currentId) return;
  setPreviewMode(!isPreview);
});

// ── Pin ────────────────────────────────────────────────────────────────────
document.getElementById('pinBtn').addEventListener('click', () => {
  if (!currentId) return;
  const btn = document.getElementById('pinBtn');
  btn.classList.toggle('active');
  scheduleSave();
});

// ── Delete ─────────────────────────────────────────────────────────────────
document.getElementById('deleteBtn').addEventListener('click', async () => {
  if (!currentId) return;
  if (!confirm('Delete this memo? This cannot be undone.')) return;
  clearTimeout(saveTimer);
  await api('/memos/' + currentId, { method: 'DELETE' });
  const prevId = currentId;
  currentId = null;
  allMemos = allMemos.filter(m => m.id !== prevId);
  renderList(allMemos);
  showEditor(false);
});

// ── Search ─────────────────────────────────────────────────────────────────
let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', function () {
  clearTimeout(searchTimer);
  const q = this.value.trim();
  if (!q) {
    isSearchMode = false;
    renderList(allMemos);
    return;
  }
  searchTimer = setTimeout(async () => {
    isSearchMode = true;
    const res = await api('/search?q=' + encodeURIComponent(q));
    const results = res.ok ? await res.json() : [];
    renderList(results, true);
  }, 300);
});

// ── Mobile back ────────────────────────────────────────────────────────────
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('hidden');
});

// ── Keyboard shortcuts ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
    e.preventDefault();
    document.getElementById('newMemoBtn').click();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === '/') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    flushSave();
  }
});

// ── Init ───────────────────────────────────────────────────────────────────
(async function init() {
  TOKEN = getTok();
  if (TOKEN && await checkAuth(TOKEN)) {
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    await bootstrap();
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f4;--surface:#fff;--border:#e7e5e4;
  --text:#1c1917;--muted:#78716c;--accent:#6366f1;--accent-hover:#4f46e5;
  --danger:#ef4444;--pin:#f59e0b;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

#auth-overlay{position:fixed;inset:0;background:#1c1917;display:flex;align-items:center;justify-content:center;z-index:1000}
#auth-overlay.hidden{display:none}
.auth-box{background:#fff;border-radius:16px;padding:40px;width:360px;text-align:center}
.auth-box h1{font-size:1.5rem;font-weight:600;margin-bottom:8px}
.auth-box p{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.auth-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;font-family:inherit;margin-bottom:12px}
.auth-box button{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;font-family:inherit;cursor:pointer;font-weight:500}
.auth-box button:hover{background:var(--accent-hover)}
#auth-error{color:var(--danger);font-size:.85rem;margin-top:8px;min-height:20px}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-size:1.2rem;font-weight:600;flex-shrink:0}
.search-wrap{flex:1}
.search-wrap input{width:100%;padding:8px 14px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;background:var(--bg);color:var(--text)}
.search-wrap input:focus{outline:none;border-color:var(--accent)}
#new-btn{padding:8px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.9rem;font-family:inherit;cursor:pointer;font-weight:500;white-space:nowrap;flex-shrink:0}
#new-btn:hover{background:var(--accent-hover)}
#rebuild-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:.82rem;cursor:pointer;color:var(--muted);flex-shrink:0;line-height:1;font-family:inherit}
#rebuild-btn:hover{border-color:var(--accent);color:var(--accent)}
#trash-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:.9rem;cursor:pointer;color:var(--muted);flex-shrink:0;line-height:1;position:relative;display:inline-flex;align-items:center;gap:5px}
#trash-btn:hover{border-color:var(--danger);color:var(--danger)}
#trash-btn.active{border-color:var(--danger);color:var(--danger);background:#fef2f2}
#trash-count{background:var(--danger);color:#fff;font-size:.65rem;font-weight:700;border-radius:10px;padding:1px 5px;line-height:1.4;display:none}

#tag-bar{padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border)}
.tag-pill{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;font-size:.82rem;font-family:inherit;cursor:pointer;color:var(--muted);transition:all .1s}
.tag-pill:hover{border-color:var(--accent);color:var(--accent)}
.tag-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

main{padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

.memo-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.memo-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.card-cover{height:140px;background-size:cover;background-position:center}
.card-cover.no-cover{background:linear-gradient(135deg,#e0e7ff 0%,#ede9fe 100%)}
.card-body{padding:16px;flex:1;display:flex;flex-direction:column;gap:6px}
.card-memo-id{font-family:'DM Mono',monospace;font-size:.73rem;color:var(--accent);font-weight:500;letter-spacing:.03em}
.card-title{font-weight:600;font-size:.95rem;line-height:1.3}
.card-title.untitled{color:var(--muted);font-weight:400;font-style:italic}
.card-desc{font-size:.82rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.card-tag{font-size:.72rem;padding:2px 8px;background:#ede9fe;color:var(--accent);border-radius:10px}
.card-footer{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--border)}
.card-date{font-size:.75rem;color:var(--muted);flex:1}
.card-uid{font-size:.72rem;color:var(--muted);font-family:'DM Mono',monospace;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-icon{background:none;border:none;cursor:pointer;padding:4px 5px;border-radius:6px;font-size:.85rem;opacity:.45;line-height:1;transition:opacity .1s}
.btn-icon:hover{opacity:1;background:var(--bg)}
.btn-icon.pinned{opacity:1}

#empty{display:none;grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
#empty h2{font-size:1.1rem;margin-bottom:8px;font-weight:500}
#trash-bar{display:none;padding:10px 24px;background:#fef2f2;border-bottom:1px solid #fecaca;align-items:center;gap:12px}
#trash-bar span{font-size:.88rem;color:#991b1b;flex:1}
#trash-bar button{padding:6px 14px;border-radius:7px;font-size:.82rem;cursor:pointer;font-family:inherit;border:1px solid #fecaca;background:transparent;color:#991b1b}
#trash-bar .empty-btn{background:#ef4444;color:#fff;border-color:#ef4444;font-weight:500}
.card-trash-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.card-trash-actions button{flex:1;padding:6px 0;border-radius:7px;font-size:.8rem;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:transparent;color:var(--muted)}
.card-trash-actions .restore-btn{border-color:var(--accent);color:var(--accent)}
.card-trash-actions .restore-btn:hover{background:var(--accent);color:#fff}
.card-trash-actions .perm-btn:hover{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="auth-box">
    <h1>Memo</h1>
    <p>Enter your passphrase to continue</p>
    <input type="password" id="auth-input" placeholder="Passphrase" autocomplete="current-password">
    <button onclick="doAuth()">Unlock</button>
    <div id="auth-error"></div>
  </div>
</div>

<header>
  <div class="logo">Memo</div>
  <div class="search-wrap">
    <input type="search" id="search-input" placeholder="Search memos…" oninput="onSearch(this.value)">
  </div>
  <button id="rebuild-btn" title="Rebuild search index — run this after deploying a worker update, or if search results seem stale. Takes a few seconds." onclick="rebuildIndex()">⟳ Reindex</button>
  <button id="trash-btn" title="Trash" onclick="toggleTrash()">🗑 <span id="trash-count"></span></button>
  <button id="new-btn" onclick="newMemo()">+ New Memo</button>
</header>

<div id="trash-bar">
  <span id="trash-bar-label">Trashed memos</span>
  <button onclick="emptyTrash()" class="empty-btn">Empty trash</button>
  <button onclick="toggleTrash()">← Back</button>
</div>

<div id="tag-bar">
  <button class="tag-pill active" data-tag="" onclick="filterTag(this,'')">All</button>
</div>

<main id="grid">
  <div id="empty"><h2>No memos yet</h2><p>Click "+ New Memo" to get started.</p></div>
</main>

<script>
const WORKER = 'https://memo-worker.ausz.workers.dev';
let token = localStorage.getItem('memo_token') || '';
let allMemos = [], currentTag = '', searchTimer;

function api(path, opts = {}) {
  const sep = path.includes('?') ? '&' : '?';
  return fetch(WORKER + path + sep + 't=' + encodeURIComponent(token), opts).then(r => {
    if (r.status === 401) { logout(); throw new Error('unauthorized'); }
    return r;
  });
}

function logout() {
  localStorage.removeItem('memo_token');
  token = '';
  document.getElementById('auth-overlay').classList.remove('hidden');
}

async function doAuth() {
  token = document.getElementById('auth-input').value.trim();
  document.getElementById('auth-error').textContent = '';
  try {
    const r = await fetch(WORKER + '?check=1&t=' + encodeURIComponent(token));
    if (r.ok) {
      localStorage.setItem('memo_token', token);
      document.getElementById('auth-overlay').classList.add('hidden');
      init();
    } else {
      document.getElementById('auth-error').textContent = 'Wrong passphrase.';
    }
  } catch { document.getElementById('auth-error').textContent = 'Connection error.'; }
}

document.getElementById('auth-input').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });

async function init() {
  if (!token) return;
  const r = await fetch(WORKER + '?check=1&t=' + encodeURIComponent(token)).catch(() => null);
  if (!r || !r.ok) { document.getElementById('auth-overlay').classList.remove('hidden'); return; }
  document.getElementById('auth-overlay').classList.add('hidden');
  loadTags();
  loadMemos();
  updateTrashCount();
}

async function loadTags() {
  try {
    const tags = await (await api('/tags')).json();
    const bar = document.getElementById('tag-bar');
    bar.innerHTML = '<button class="tag-pill active" data-tag="" onclick="filterTag(this,\'\')">All</button>';
    tags.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tag-pill'; b.dataset.tag = t; b.textContent = t;
      b.onclick = () => filterTag(b, t);
      bar.appendChild(b);
    });
  } catch {}
}

async function loadMemos(tag) {
  tag = tag ?? currentTag;
  try {
    const path = tag ? '/memos?tag=' + encodeURIComponent(tag) : '/memos';
    allMemos = await (await api(path)).json();
    renderMemos(allMemos);
  } catch {}
}

function fileUrl(memoId, key) {
  return WORKER + '/memos/' + memoId + '/files/' + key.split('/').map(encodeURIComponent).join('/') + '?t=' + encodeURIComponent(token);
}

function renderMemos(memos, trashMode = false) {
  const grid = document.getElementById('grid');
  grid.querySelectorAll('.memo-card').forEach(c => c.remove());
  document.getElementById('empty').style.display = memos.length ? 'none' : 'block';
  memos.forEach(m => {
    const tags = safeJson(m.tags, []);
    const cover = m.cover_file ? fileUrl(m.id, m.cover_file) : '';
    const card = document.createElement('div');
    card.className = 'memo-card';
    if (!trashMode) card.onclick = () => location.href = 'memo/?id=' + m.id;
    card.innerHTML = `
      <div class="card-cover ${cover ? '' : 'no-cover'}" ${cover ? `style="background-image:url('${esc(cover)}')"` : ''}></div>
      <div class="card-body">
        <div class="card-memo-id">${esc(m.memo_id)}</div>
        <div class="card-title ${m.title ? '' : 'untitled'}">${esc(m.title || 'Untitled')}</div>
        ${m.description ? `<div class="card-desc">${esc(m.description)}</div>` : ''}
        ${tags.length ? `<div class="card-tags">${tags.map(t=>`<span class="card-tag">${esc(t)}</span>`).join('')}</div>` : ''}
        ${trashMode ? `
        <div class="card-trash-actions">
          <button class="restore-btn" onclick="restoreMemo(event,'${m.id}')">↩ Restore</button>
          <button class="perm-btn" onclick="permanentDelete(event,'${m.id}')">Delete forever</button>
        </div>` : `
        <div class="card-footer">
          <span class="card-date">${fmtDate(m.created_at)}</span>
          ${m.uid ? `<span class="card-uid" title="${esc(m.uid)}">${esc(m.uid)}</span>` : ''}
          <button class="btn-icon ${m.pinned?'pinned':''}" title="${m.pinned?'Unpin':'Pin'}" onclick="togglePin(event,'${m.id}',${m.pinned})">📌</button>
          <button class="btn-icon" title="Move to trash" onclick="deleteMemo(event,'${m.id}')">🗑</button>
        </div>`}
      </div>`;
    grid.appendChild(card);
  });
}

function filterTag(el, tag) {
  currentTag = tag;
  document.querySelectorAll('.tag-pill').forEach(b => b.classList.toggle('active', b.dataset.tag === tag));
  loadMemos(tag);
}

function onSearch(q) {
  clearTimeout(searchTimer);
  q = q.trim();
  if (!q) { renderMemos(allMemos); return; }
  searchTimer = setTimeout(async () => {
    try { renderMemos(await (await api('/search?q=' + encodeURIComponent(q))).json()); } catch {}
  }, 300);
}

async function newMemo() {
  try {
    const r = await api('/memos', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const { id } = await r.json();
    location.href = 'memo/?id=' + id;
  } catch {}
}

async function togglePin(e, id, pinned) {
  e.stopPropagation();
  const m = allMemos.find(x => x.id === id);
  if (!m) return;
  try {
    await api('/memos/' + id, { method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ title:m.title, description:m.description, uid:m.uid, cover_file:m.cover_file,
        tags:safeJson(m.tags,[]), links:safeJson(m.links,[]), pinned: pinned ? 0 : 1 }) });
    loadMemos();
  } catch {}
}

let inTrash = false;

async function deleteMemo(e, id) {
  e.stopPropagation();
  try { await api('/memos/' + id, { method:'DELETE' }); loadMemos(); updateTrashCount(); } catch {}
}

async function updateTrashCount() {
  try {
    const memos = await (await api('/memos?trash=1')).json();
    const badge = document.getElementById('trash-count');
    if (memos.length) { badge.textContent = memos.length; badge.style.display = ''; }
    else { badge.style.display = 'none'; }
  } catch {}
}

function toggleTrash() {
  inTrash = !inTrash;
  document.getElementById('trash-btn').classList.toggle('active', inTrash);
  document.getElementById('trash-bar').style.display = inTrash ? 'flex' : 'none';
  document.getElementById('tag-bar').style.display = inTrash ? 'none' : '';
  document.getElementById('new-btn').style.display = inTrash ? 'none' : '';
  document.getElementById('search-input').value = '';
  if (inTrash) loadTrash(); else loadMemos();
}

async function loadTrash() {
  try {
    const memos = await (await api('/memos?trash=1')).json();
    document.getElementById('trash-bar-label').textContent =
      memos.length ? `${memos.length} trashed memo${memos.length !== 1 ? 's' : ''}` : 'Trash is empty';
    renderMemos(memos, true);
  } catch {}
}

async function restoreMemo(e, id) {
  e.stopPropagation();
  try { await api('/memos/' + id + '/untrash', { method:'POST' }); loadTrash(); updateTrashCount(); } catch {}
}

async function permanentDelete(e, id) {
  e.stopPropagation();
  if (!confirm('Permanently delete this memo and all its files? This cannot be undone.')) return;
  try { await api('/memos/' + id + '?permanent=1', { method:'DELETE' }); loadTrash(); updateTrashCount(); } catch {}
}

async function emptyTrash() {
  if (!confirm('Permanently delete all trashed memos and their files? This cannot be undone.')) return;
  try {
    const memos = await (await api('/memos?trash=1')).json();
    await Promise.all(memos.map(m => api('/memos/' + m.id + '?permanent=1', { method:'DELETE' })));
    loadTrash(); updateTrashCount(); loadTags();
  } catch {}
}

async function rebuildIndex() {
  const btn = document.getElementById('rebuild-btn');
  btn.textContent = '…'; btn.disabled = true;
  try {
    const r = await api('/search/rebuild', { method: 'POST' });
    const d = await r.json();
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = '⟳'; btn.disabled = false; }, 2000);
    console.log('Search index rebuilt:', d.count, 'memos');
  } catch {
    btn.textContent = '⟳'; btn.disabled = false;
    alert('Rebuild failed — check console.');
  }
}

function safeJson(s, fallback) { try { return typeof s === 'string' ? JSON.parse(s) : (s || fallback); } catch { return fallback; } }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }

init();
</script>
</body>
</html>
